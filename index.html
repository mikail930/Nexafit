<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nexafit</title>
<meta name="description" content="Suivi de prise de masse : repas, macros, eau, sommeil, poids et musculation.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nexafit">
<meta name="theme-color" content="#0B0D12">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400..800&family=Manrope:wght@400..800&display=swap">
<style>
:root { color-scheme: dark; padding-top: env(safe-area-inset-top, 0px); }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 25; }
img { max-width: 100%; }
[hidden] { display: none !important; }
.sheet { padding-top: calc(env(safe-area-inset-top, 0px) + 8px); }

/* Layout : une colonne façon appli iPhone, barre d'onglets en bas, feuilles qui montent du bas.
   Thème sombre unique, choisi exprès : fond noir profond, cartes effet verre, accent braise.
   Macros : protéines rose, glucides bleu, lipides jaune. */
:root {
  color-scheme: dark;
  --bg: #0B0D12;
  --surface: #151922;
  --surface-2: #1D222D;
  --hero: #161B25;
  --ink: #F2F4F8;
  --muted: #A3ABBA;
  --faint: #737B8D;
  --line: #262C38;
  --brand: #FF7A45;
  --brand-ink: #0B0D12;
  --prot: #FF5D73;
  --carb: #5B9DFF;
  --fat: #FFC857;
  --water: #5CC8F5;
  --sleep: #A898FF;
  --good: #4ADE95;
  --warn: #FFB347;
  --steel: #F2F4F8;
  --shadow: inset 0 0 0 1px rgba(255,255,255,.07), 0 12px 30px rgba(0,0,0,.35);
  --scrim: rgba(0,0,0,.62);
  --f-display: "Sora", "Manrope", system-ui, sans-serif;
  --f-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 18px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); color: var(--ink); }
body {
  font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px));
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2.5px solid var(--carb); outline-offset: 2px; border-radius: 8px; }
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; padding-top: 14px; }
.num { font-family: var(--f-display); font-variant-numeric: tabular-nums; }
.ico { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ico.sm { width: 18px; height: 18px; }
.ico.fill { fill: currentColor; stroke: none; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.label { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; font-weight: 650; color: var(--muted); }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.h-view { font-family: var(--f-display); font-weight: 700; font-size: 30px; letter-spacing: -.01em; line-height: 1.05; }
.h-sec { font-family: var(--f-display); font-weight: 750; font-size: 18px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.sec { display: flex; flex-direction: column; gap: 10px; }

/* En-tête */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-weight: 800; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; }
.brand-mark { width: 26px; height: 26px; border-radius: 50%; background: var(--brand); display: grid; place-items: center; box-shadow: inset 0 0 0 4px color-mix(in srgb, var(--brand) 70%, #000 30%); }
.brand-mark::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--bg); }
.sync { font-size: 12px; color: var(--faint); display: flex; align-items: center; gap: 6px; }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); display: block; }
.sync.local i { background: var(--warn); }
.sync.busy i { background: var(--carb); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.daynav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.daynav .title { display: flex; flex-direction: column; }
.daynav .sub { font-size: 13px; color: var(--muted); }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--ink); background: var(--surface); box-shadow: var(--shadow); }
.icon-btn:disabled { opacity: .35; }
.icon-btn.plain { background: transparent; box-shadow: none; }
.streak { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 650; color: var(--brand); }

/* Résumé du jour */
.summary { background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); padding: 18px; display: flex; flex-direction: column; gap: 16px; }
.sum-top { display: grid; grid-template-columns: 132px 1fr; gap: 16px; align-items: center; }
.ring { position: relative; width: 132px; height: 132px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .trk { stroke: var(--surface-2); }
.ring .val { stroke: var(--brand); transition: stroke-dashoffset .7s cubic-bezier(.2,.8,.2,1); }
.ring.over .val { stroke: var(--warn); }
.ring-c { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; align-content: center; }
.ring-c b { font-family: var(--f-display); font-weight: 700; font-size: 30px; line-height: 1; }
.ring-c span { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
.kstats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
.kstat { display: flex; flex-direction: column; min-width: 0; }
.kstat b { font-family: var(--f-display); font-weight: 750; font-size: 19px; font-variant-numeric: tabular-nums; }
.kstat span { font-size: 12px; color: var(--muted); }
.macros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.macro { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.macro .mh { display: flex; justify-content: space-between; align-items: baseline; gap: 4px; font-size: 12.5px; }
.macro .mh b { font-family: var(--f-display); font-weight: 750; font-size: 15px; font-variant-numeric: tabular-nums; }
.bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: var(--c, var(--brand)); transition: width .6s cubic-bezier(.2,.8,.2,1); }
.plate-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); display: inline-block; margin-right: 5px; box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--c) 60%, #000 40%); }

/* Barre olympique */
.barbell { width: 100%; height: 56px; display: block; }

/* Check-in du jour */
.checkins { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.chk { background: var(--surface); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 8px; text-align: left; box-shadow: var(--shadow); min-width: 0; }
.chk .ct { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); font-weight: 600; }
.chk .ct .ico { width: 16px; height: 16px; color: var(--c); }
.chk b { font-family: var(--f-display); font-weight: 800; font-size: 20px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.chk b small { font-size: 12px; font-weight: 600; color: var(--muted); font-family: var(--f-body); }
.chk.todo b { color: var(--faint); }
.glasses { display: flex; gap: 2px; flex-wrap: wrap; }
.glasses i { width: 7px; height: 12px; border-radius: 2px 2px 3px 3px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); }
.glasses i.on { background: var(--water); box-shadow: none; }

/* Repas */
.meal { display: flex; flex-direction: column; }
.meal-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 0; }
.meal-h .mt { display: flex; flex-direction: column; min-width: 0; }
.meal-h .mk { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.add-btn { display: inline-flex; align-items: center; gap: 4px; height: 34px; padding: 0 12px 0 8px; border-radius: 99px; background: color-mix(in srgb, var(--brand) 11%, transparent); color: var(--brand); font-weight: 650; font-size: 13.5px; }
.add-btn .ico { width: 18px; height: 18px; stroke-width: 2.2; }
.items { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 11px 14px; width: 100%; text-align: left; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.item:active { background: var(--surface-2); }
.item .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.item .ds { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.item .kc { font-family: var(--f-display); font-weight: 750; font-variant-numeric: tabular-nums; text-align: right; }
.item .kc small { display: block; font-family: var(--f-body); font-weight: 500; font-size: 11.5px; color: var(--faint); }
.item > div { min-width: 0; }
.empty-meal { font-size: 13.5px; color: var(--faint); padding: 2px 0 6px; }
.row-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* Boutons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 20px; border-radius: 14px; background: var(--brand); color: var(--brand-ink); font-weight: 700; font-size: 15.5px; }
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .45; }
.btn.block { width: 100%; }
.btn.ghost { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.btn.soft { background: var(--surface-2); color: var(--ink); }
.btn.danger { background: transparent; color: var(--brand); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--brand) 40%, transparent); }
.btn.sm { height: 38px; padding: 0 14px; font-size: 14px; border-radius: 11px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 13px; border-radius: 99px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); font-size: 13.5px; font-weight: 600; white-space: nowrap; }
.chip.on { background: var(--ink); color: var(--bg); box-shadow: none; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.seg { display: flex; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { flex: 1; height: 34px; border-radius: 9px; font-size: 13.5px; font-weight: 650; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

/* Champs */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.inp { height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); padding: 0 13px; width: 100%; min-width: 0; font-size: 16px; }
.inp:focus { border-color: var(--carb); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--carb) 18%, transparent); }
textarea.inp { height: auto; min-height: 92px; padding: 11px 13px; resize: vertical; line-height: 1.45; }
select.inp { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.search { position: relative; }
.search .ico { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--faint); }
.search .inp { padding-left: 42px; }
.stepper { display: flex; align-items: center; gap: 10px; }
.stepper button { width: 46px; height: 46px; border-radius: 12px; background: var(--surface-2); font-size: 22px; font-weight: 600; display: grid; place-items: center; }
.stepper .inp { text-align: center; font-family: var(--f-display); font-weight: 750; font-size: 20px; }

/* Listes génériques */
.list { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.li { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-top: 1px solid var(--line); width: 100%; text-align: left; min-height: 54px; }
.li:first-child { border-top: 0; }
.li:active { background: var(--surface-2); }
.li .lt { flex: 1; min-width: 0; }
.li .lt b { display: block; font-weight: 620; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .lt span { display: block; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .rt { font-family: var(--f-display); font-weight: 750; font-variant-numeric: tabular-nums; flex: none; text-align: right; }
.li .lic { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); color: var(--ink); flex: none; }
.li .chev { color: var(--faint); }
.group-label { padding: 14px 2px 6px; }
.note { font-size: 13px; color: var(--muted); line-height: 1.5; }
.callout { background: var(--surface-2); border-radius: 14px; padding: 12px 14px; font-size: 13.5px; color: var(--muted); line-height: 1.5; }
.callout b { color: var(--ink); }
.tag { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 6px; font-size: 11px; font-weight: 700; letter-spacing: .03em; background: var(--surface-2); color: var(--muted); }
.tag.pr { background: color-mix(in srgb, var(--fat) 22%, transparent); color: color-mix(in srgb, var(--fat) 55%, var(--ink)); }
.tag.ai { background: color-mix(in srgb, var(--sleep) 16%, transparent); color: var(--sleep); }

/* Onglets */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: rgba(11,13,18,.9); backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4); border-top: 1px solid var(--line);
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-bottom: max(8px, env(safe-area-inset-bottom, 0px)); padding-top: 6px; }
.tabs-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10.5px; font-weight: 650; color: var(--faint); padding: 4px 0; letter-spacing: .02em; }
.tab.on { color: var(--ink); }
.tab .ico { width: 24px; height: 24px; }
.fab { justify-self: center; width: 56px; height: 56px; border-radius: 50%; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; margin-top: -22px; box-shadow: 0 6px 18px color-mix(in srgb, var(--brand) 45%, transparent), inset 0 0 0 5px color-mix(in srgb, var(--brand) 78%, #000 22%); }
.fab .ico { width: 26px; height: 26px; stroke-width: 2.4; }
.fab:active { transform: scale(.94); }

/* Feuilles (bottom sheets) */
.sheet { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; justify-content: flex-end; }
.sheet .scrim { position: absolute; inset: 0; background: var(--scrim); animation: fade .2s ease; }
.sheet .panel { position: relative; background: #0F1218; box-shadow: inset 0 1px 0 rgba(255,255,255,.08); border-radius: 22px 22px 0 0; max-height: 94%; display: flex; flex-direction: column; animation: up .28s cubic-bezier(.2,.8,.2,1); width: 100%; max-width: 600px; margin: 0 auto;
  padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet.full .panel { height: 94%; }
.panel-h { display: flex; align-items: center; gap: 10px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
.panel-h::before { content: ""; position: absolute; top: 7px; left: 50%; width: 38px; height: 5px; margin-left: -19px; border-radius: 9px; background: var(--line); }
.panel-h h2 { flex: 1; font-family: var(--f-display); font-weight: 800; font-size: 20px; padding-top: 12px; min-width: 0; }
.panel-h .icon-btn { margin-top: 10px; }
.panel-b { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 6px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 16px; flex: 1; overscroll-behavior: contain; }
.panel-f { padding: 10px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); border-top: 1px solid var(--line); background: #0F1218; display: flex; gap: 10px; }
.panel-f .btn { flex: 1; }
@keyframes up { from { transform: translateY(100%); } }
@keyframes fade { from { opacity: 0; } }
.sheet.closing .panel { transform: translateY(100%); transition: transform .2s ease-in; }
.sheet.closing .scrim { opacity: 0; transition: opacity .2s; }

/* Toast */
.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); z-index: 80; background: var(--ink); color: var(--bg); padding: 11px 16px; border-radius: 14px; font-weight: 600; font-size: 14px; opacity: 0; pointer-events: none; transition: .25s; max-width: calc(100% - 32px); display: flex; align-items: center; gap: 10px; box-shadow: var(--shadow); }
.toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast button { color: var(--fat); font-weight: 700; }

/* Chrono de repos */
.timer { position: fixed; z-index: 40; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); width: min(528px, calc(100% - 32px)); background: var(--hero); color: var(--ink); border-radius: 18px; padding: 10px 10px 10px 16px; border: 1px solid var(--line); display: flex; align-items: center; gap: 10px; box-shadow: var(--shadow); overflow: hidden; }
.timer .tprog { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--brand); transition: width 1s linear; }
.timer b { font-family: var(--f-display); font-weight: 700; font-size: 24px; font-variant-numeric: tabular-nums; min-width: 64px; }
.timer .tl { flex: 1; font-size: 12.5px; opacity: .75; min-width: 0; }
.timer button { height: 36px; min-width: 44px; padding: 0 10px; border-radius: 10px; background: rgba(255,255,255,.08); color: var(--ink); font-weight: 700; font-size: 13px; }
.timer.done { background: var(--good); color: #0B0D12; }
.timer.done button { color: #0B0D12; background: rgba(0,0,0,.12); }

/* Muscu */
.session-h { background: var(--hero); color: var(--ink); box-shadow: var(--shadow); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.session-h .h-sec { color: var(--ink); }
.session-h .ss { display: flex; gap: 18px; font-size: 12.5px; opacity: .8; flex-wrap: wrap; }
.session-h .ss b { font-family: var(--f-display); font-size: 17px; display: block; opacity: 1; font-variant-numeric: tabular-nums; }
.exo { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.exo-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.exo-h b { font-family: var(--f-display); font-weight: 750; font-size: 16.5px; }
.exo-h .prev { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.sets { display: flex; flex-direction: column; gap: 6px; }
.set { display: grid; grid-template-columns: 30px 1fr 1fr 46px; gap: 8px; align-items: center; }
.set .n { font-family: var(--f-display); font-weight: 750; color: var(--faint); text-align: center; font-size: 14px; }
.set .inp { height: 42px; text-align: center; font-family: var(--f-display); font-weight: 700; font-size: 17px; padding: 0 6px; }
.set .ok { width: 46px; height: 42px; border-radius: 11px; background: var(--surface-2); color: var(--faint); display: grid; place-items: center; }
.set.done .ok { background: var(--good); color: #fff; }
.set.done .inp { background: color-mix(in srgb, var(--good) 8%, var(--surface)); border-color: color-mix(in srgb, var(--good) 30%, var(--line)); }
.set-h { display: grid; grid-template-columns: 30px 1fr 1fr 46px; gap: 8px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); text-align: center; }
.prog-card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.prog-days { display: flex; flex-direction: column; gap: 8px; }

/* ---------- traduction d'un texte ---------- */
const cache = new Map();
function tr(s) {
  if (lang === 'fr' || !s) return null;
  const key = lang + '\u0001' + s;
  if (cache.has(key)) return cache.get(key);
  let r = null;
  const d = D.get(s);
  if (d) r = d[E() ? 0 : 1];
  else {
    for (const [re, fn] of P) { const m = s.match(re); if (m) { r = fn(m); if (r != null) break; } }
    if (r == null && s.includes(' · ')) {
      let ch = false; const o = s.split(' · ').map(p => { const x = tr(p); if (x != null) { ch = true; return x; } return p; });
      if (ch) r = o.join(' · ');
    }
    if (r == null && /[.!?] [A-ZÀ-ÖØ-Þ«\d]/.test(s)) {
      let ch = false; const o = s.split(/(?<=[.!?])\s+(?=[A-ZÀ-ÖØ-Þ«\d])/).map(p => { const x = tr(p); if (x != null) { ch = true; return x; } return p; });
      if (ch) r = o.join(' ');
    }
    if (r == null && s.includes(', ')) {
      const parts = s.replace(/…$/, '').split(', ');
      if (parts.some(p => D.has(p))) r = parts.map(p => D.has(p) ? D.get(p)[E() ? 0 : 1] : p).join(', ') + (s.endsWith('…') ? '…' : '');
    }
    if (r == null && s.startsWith('· ')) { const x = tr(s.slice(2)); if (x != null) r = '· ' + x; }
  }
  if (cache.size > 5000) cache.clear();
  cache.set(key, r);
  return r;
}

/* ---------- traduction de la page ---------- */
const ATTRS = ['placeholder', 'aria-label', 'title'];
const SKIP = { STYLE: 1, SCRIPT: 1, TEXTAREA: 1, svg: 1, SVG: 1 };
const done = new WeakMap();
function trText(n) {
  const p = n.parentNode;
  if (!p || SKIP[p.nodeName] || (p.closest && p.closest('[data-notr]'))) return;
  const raw = n.nodeValue;
  if (done.get(n) === raw) return;
  const s = raw.trim();
  if (!s || !/[A-Za-zÀ-ÿ]/.test(s)) return;
  const r = tr(s);
  if (r != null && r !== s) { const out = raw.replace(s, r); done.set(n, out); n.nodeValue = out; }
}
function trEl(el) {
  if (el.closest && el.closest('[data-notr]')) return;
  for (const a of ATTRS) { const v = el.getAttribute(a); if (v) { const r = tr(v.trim()); if (r != null) el.setAttribute(a, r); } }
}
function walk(root) {
  if (lang === 'fr' || !root) return;
  if (root.nodeType === 3) return trText(root);
  if (root.nodeType !== 1 || SKIP[root.nodeName]) return;
  trEl(root);
  const w = document.createTreeWalker(root, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT);
  let x;
  while ((x = w.nextNode())) { if (x.nodeType === 3) trText(x); else trEl(x); }
}
let observer = null;
function start() {
  if (observer || !document.body) return;
  observer = new MutationObserver(ms => { if (lang === 'fr') return; for (const m of ms) { if (m.type === 'characterData') trText(m.target); else m.addedNodes.forEach(walk); } });
  observer.observe(document.body, { childList: true, subtree: true, characterData: true });
  walk(document.body);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();

async function lookupOFF(code) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 9000);
  try {
    const r = await fetch('https://world.openfoodfacts.org/api/v2/product/' + encodeURIComponent(code) + '.json?fields=product_name,product_name_fr,generic_name_fr,brands,nutriments,serving_quantity', { signal: ctl.signal });
    if (r.status === 404) return null;
    if (!r.ok) throw new Error('http ' + r.status);
    const j = await r.json();
    if (!j || j.status !== 1 || !j.product) return null;
    const pr = j.product, n = pr.nutriments || {};
    const g = key => { const v = n[key]; return (v === '' || v == null || !isFinite(+v)) ? null : +v; };
    let k = g('energy-kcal_100g');
    if (k == null && g('energy_100g') != null) k = g('energy_100g') / 4.184;
    const per = { k, p: g('proteins_100g'), c: g('carbohydrates_100g'), f: g('fat_100g') };
    let name = String(pr.product_name_fr || pr.product_name || pr.generic_name_fr || '').trim();
    if (name) name = name.charAt(0).toUpperCase() + name.slice(1);
    const brand = String(pr.brands || '').split(',')[0].trim();
    const sq = +pr.serving_quantity;
    const r1 = v => v == null ? '' : Math.round(v * 10) / 10;
    const complete = !!name && per.k != null && per.p != null && per.c != null && per.f != null;
    return {
      name, brand, complete,
      per: complete ? { k: Math.round(per.k), p: r1(per.p), c: r1(per.c), f: r1(per.f) } : null,
      perRaw: { k: per.k == null ? '' : Math.round(per.k), p: r1(per.p), c: r1(per.c), f: r1(per.f) },
      unit: sq > 0 && sq < 2000 ? ['portion', Math.round(sq)] : null
    };
  } finally { clearTimeout(t); }
}
NX.lookupOFF = lookupOFF;

async function decodeBarcode(file) {
  const Z = window.ZXing;
  if (!Z) return null;
  const img = await loadImage(file);
  const hints = new Map();
  hints.set(Z.DecodeHintType.TRY_HARDER, true);
  hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.UPC_E, Z.BarcodeFormat.CODE_128]);
  const reader = new Z.MultiFormatReader(); reader.setHints(hints);
  for (const size of [1400, 900, 2000]) for (const rot of [0, 90]) {
    try {
      const c = drawScaled(img, size, rot);
      const src = new Z.HTMLCanvasElementLuminanceSource(c);
      const res = reader.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(src)));
      if (res && res.getText()) return res.getText();
    } catch (e) { /* essai suivant */ }
  }
  return null;
}
function loadImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => { res(im); setTimeout(() => URL.revokeObjectURL(url), 1000); };
    im.onerror = rej; im.src = url;
  });
}
function drawScaled(img, max, rot) {
  const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.round(img.naturalWidth * s), h = Math.round(img.naturalHeight * s);
  const c = document.createElement('canvas');
  c.width = rot ? h : w; c.height = rot ? w : h;
  const x = c.getContext('2d', { willReadFrequently: true });
  if (rot) { x.translate(h / 2, w / 2); x.rotate(rot * Math.PI / 180); x.drawImage(img, -w / 2, -h / 2, w, h); }
  else x.drawImage(img, 0, 0, w, h);
  return c;
}

let REST = null, restT = null, audioCtx = null;

}

  try {
    if (!audioCtx) return;
    [0, .22, .44].forEach((t, i) => { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.frequency.value = i === 2 ? 1175 : 880; g.gain.setValueAtTime(.0001, audioCtx.currentTime + t); g.gain.exponentialRampToValueAtTime(.25, audioCtx.currentTime + t + .02); g.gain.exponentialRampToValueAtTime(.0001, audioCtx.currentTime + t + .18); o.connect(g).connect(audioCtx.destination); o.start(audioCtx.currentTime + t); o.stop(audioCtx.currentTime + t + .2); });
  } catch (e) { }
  try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) { }
}

}

    el.innerHTML = ico('timer') + '<b id="t-left"></b><span class="tl" id="t-lbl"></span><button data-a="rest-adj" data-s="-15">−15</button><button data-a="rest-adj" data-s="15">+15</button><button data-a="rest-stop" aria-label="Arrêter le chrono">' + ico('x', 'sm') + '</button><i class="tprog" id="t-prog"></i>';
  }

/* Nexafit — courses : ce qu'il me faut (journée type ou journal), ticket avec prix, liste de courses. */
(function () {
'use strict';
const { $, esc, uid, clone, num, numOrNull, fmt, norm, addDays, today, ico, S, UI, A, IN, CH } = NX;

const euro = v => (v == null || !isFinite(v)) ? '–' : NX.LOC() !== 'en-GB' ? Number(v).toLocaleString(NX.LOC(), { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €' : Number(v).toLocaleString(NX.LOC(), { style: 'currency', currency: 'EUR' });
NX.euro = euro;
UI.shopTab = UI.shopTab || 'need';

const STARTER = [["Flocons d'avoine", 80], ["Lait demi-écrémé", 400], ["Œuf entier", 165], ["Riz basmati cru", 120], ["Pâtes crues", 120], ["Filet de poulet cru", 250], ["Thon au naturel (égoutté)", 104], ["Fromage blanc 3 %", 200], ["Banane", 240], ["Pomme", 150], ["Beurre de cacahuète", 30], ["Huile d'olive", 15], ["Poêlée de légumes surgelés", 200]];
// ces catégories gardent leurs quantités quand on ajuste la journée type
const FIXED = ['Fruits', 'Légumes', 'Sauces & condiments', 'Boissons', 'Sucré & desserts', 'Biscuits & snacks'];
const LIQ = /^(lait|jus|boisson|huile|coca|ice tea|oasis|red bull|monster|smoothie|kéfir|blancs d'œufs liquides|hipro boisson)/i;

const dispName = f => f.name + (f.brand ? ' · ' + f.brand : '');
const isLiquid = f => !!f && (f.cat === 'Boissons' || LIQ.test(f.name));
const MEASURE = ['c. à soupe', 'c. à café', 'verre', 'portion', 'bol', 'poignée', 'noisette', 'dose', 'tranche', 'part', 'morceau', 'carré', 'rondelle', 'biscuit', 'galette', 'gousse'];
const countable = u => !!(u && u[1] && !MEASURE.includes(u[0]));
const plural = (w, n) => (n > 1 && !/[sx]$/.test(w) && !w.includes(' ') ? w + 's' : w);
const wLabel = (g, liq) => liq ? (g >= 1000 ? fmt(g / 1000, 2) + ' L' : fmt(Math.round(g)) + ' ml') : (g >= 1000 ? fmt(g / 1000, 2) + ' kg' : fmt(Math.round(g)) + ' g');

/* ---------- prix ---------- */
function expand(f, g, name) {
  // une recette est décomposée en ses ingrédients
  if (f && f.kind === 'recipe') {
    const r = S.main.recipes.find(x => x.id === f.id);
    if (r && r.items.length) {
      const w = r.weight || NX.recipeTotals(r).g || 1;
      return r.items.flatMap(it => expand(NX.foodById(it.fid) || NX.foodByName(it.name), it.g * g / w, it.name));
    }
  }
  return [{ food: f, g, name: f ? dispName(f) : name }];
}
function baseCost(f, g) {
  if (!f) return null;
  const p = NX.priceOf(f);
  if (p) return g / 1000 * p.kg;
  if (f.raw) { const rf = NX.foodByName(f.raw[0]), rp = rf && NX.priceOf(rf); if (rp) return g * f.raw[1] / 1000 * rp.kg; }
  return null;
}
NX.costOf = (f, g) => {
  if (!f) return null;
  let t = 0;
  for (const x of expand(f, g, '')) { const c = baseCost(x.food, x.g); if (c == null) return null; t += c; }
  return t;
};
const priceForKey = (key, f) => f ? NX.priceOf(f) : (S.main.prices[key] && S.main.prices[key].kg > 0 ? S.main.prices[key] : null);

/* ---------- journée type ---------- */
function itemFrom(f, g) { return { id: uid(), fid: f.id, name: dispName(f), g, per: clone(f.per), unit: f.unit ? clone(f.unit) : null, cat: f.cat }; }
const foodOf = it => NX.foodById(it.fid) || null;
const perOf = it => (foodOf(it) || it).per;
function basket() {
  if (!S.main.basket) {
    // panier de départ proposé selon les objectifs ; enregistré seulement quand l'utilisateur le modifie
    const items = STARTER.map(([n, g]) => { const f = NX.foodByName(n); return f ? itemFrom(f, g) : null; }).filter(Boolean);
    S.main.basket = { mode: 'plan', days: 7, items, seeded: true };
    adjust(false);
  }
  return S.main.basket;
}
function roundG(g, unit) {
  if (unit && unit[1] >= 30) return Math.max(unit[1], Math.round(g / unit[1]) * unit[1]);
  return Math.max(5, Math.round(g / 5) * 5);
}
function planTotals() {
  const t = { k: 0, p: 0, c: 0, f: 0, cost: 0, unknown: 0 };
  for (const it of S.main.basket.items) {
    const m = NX.macrosOf(perOf(it), it.g); t.k += m.k; t.p += m.p; t.c += m.c; t.f += m.f;
    const c = NX.costOf(foodOf(it), it.g); if (c == null) t.unknown++; else t.cost += c;
  }
  return t;
}
function adjust(toast) {
  const B = S.main.basket, g = S.main.goals;
  const rows = B.items.map(it => ({ it, per: perOf(it), cat: (foodOf(it) || it).cat }));
  let fK = 0, fP = 0, Kp = 0, Pp = 0, Ke = 0, Pe = 0;
  for (const r of rows) {
    const m = NX.macrosOf(r.per, r.it.g);
    if (FIXED.includes(r.cat) || !(r.per.k > 0)) { fK += m.k; fP += m.p; continue; }
    r.grp = r.per.p * 4 / r.per.k >= 0.33 ? 'p' : 'e';
    if (r.grp === 'p') { Kp += m.k; Pp += m.p; } else { Ke += m.k; Pe += m.p; }

}

/* ---------- d'après le journal ---------- */
function journalData() {
  const keys = [];

  for (let i = 0; i < 60 && keys.length < 14; i++, k = addDays(k, -1)) { const d = S.days[k]; if (d && NX.dayTotals(d).n) keys.push(k); }
  const map = {};
  for (const key of keys) for (const [mk] of NX.MEALS) for (const e of (S.days[key].meals[mk] || [])) {
    const f = (e.fid && NX.foodById(e.fid)) || NX.foodByName(e.name);
    const id = f ? f.id : 'n:' + norm(e.name);
    const row = map[id] || (map[id] = { id, food: f, name: f ? dispName(f) : e.name, g: 0 });
    row.g += e.g;
  }
  const n = keys.length;
  return { n, lines: Object.values(map).map(r => Object.assign(r, { g: r.g / Math.max(1, n) })) };
}

/* ---------- ce qu'il faut acheter ---------- */
function needLines() {
  const B = basket();
  if (B.mode === 'plan') return B.items.map(it => ({ food: foodOf(it), g: it.g, name: it.name }));
  return journalData().lines;
}
function buyList(lines, days) {
  const map = {};
  for (const l of lines) for (const x of expand(l.food, l.g * days, l.name)) {
    let f = x.food, g = x.g;
    if (f && f.raw) { const rf = NX.foodByName(f.raw[0]); if (rf) { g *= f.raw[1]; f = rf; } }
    const id = f ? f.id : 'n:' + norm(x.name);
    const row = map[id] || (map[id] = { id, food: f, name: f ? dispName(f) : x.name, g: 0 });
    row.g += g;
  }
  return Object.values(map).filter(r => r.g > 0.5).map(r => {
    const p = priceForKey(r.id, r.food);
    let n = 0, cost = null, exact = null;
    if (p) {
      exact = r.g / 1000 * p.kg;
      if (p.pack > 0) { n = Math.max(1, Math.ceil(r.g / p.pack - 0.05)); cost = n * p.pack / 1000 * p.kg; } else cost = exact;
    }
    return Object.assign(r, { p, n, cost, exact });
  }).sort((a, b) => (b.cost || 0) - (a.cost || 0));
}
function qtyLabel(r) {
  const f = r.food, liq = isLiquid(f), u = f && f.unit;
  if (r.p && r.p.pack > 0) {
    const per = countable(u) ? r.p.pack / u[1] : 0;
    if (per > 0.95 && per < 1.05) return r.n + ' ' + plural(u[0], r.n);
    if (per >= 2 && Math.abs(per - Math.round(per)) < 0.05) return r.n + ' × ' + Math.round(per) + ' ' + plural(u[0], Math.round(per));

function niceRange(min, max, pad) {

function lineChart(pts, o = {}) {
  // pts : [{x: index de jour, y}] ; o : {n (nb de jours), color, goal, dec, startKey}
  const W = 340, H = o.h || 150, L = 34, R = 10, T = 12, B = 22;

  const ys = pts.map(p => p.y).concat(o.goal != null ? [o.goal] : []);
  const [y0, y1] = niceRange(Math.min(...ys), Math.max(...ys), .12);
  const xMax = Math.max(1, o.n - 1);
  const X = x => L + (x / xMax) * (W - L - R), Y = y => T + (1 - (y - y0) / (y1 - y0)) * (H - T - B);
  let s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(o.label || 'Graphique') + '">';
  const gid = 'g' + Math.random().toString(36).slice(2, 7);

  for (let i = 0; i <= 3; i++) { const v = y0 + (y1 - y0) * i / 3, y = Y(v); s += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y.toFixed(1) + '" y2="' + y.toFixed(1) + '"/><text x="' + (L - 6) + '" y="' + (y + 3.5).toFixed(1) + '" text-anchor="end">' + fmt(v, o.dec || 0) + '</text>'; }
  if (o.goal != null) s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(o.goal).toFixed(1) + '" y2="' + Y(o.goal).toFixed(1) + '" stroke="' + o.color + '" stroke-width="1.2" stroke-dasharray="4 4" opacity=".7"/>';
  const d = pts.map((p, i) => (i ? 'L' : 'M') + X(p.x).toFixed(1) + ' ' + Y(p.y).toFixed(1)).join(' ');
  s += '<path d="' + d + ' L' + X(pts[pts.length - 1].x).toFixed(1) + ' ' + (H - B) + ' L' + X(pts[0].x).toFixed(1) + ' ' + (H - B) + ' Z" fill="url(#' + gid + ')" stroke="none"/>';
  s += '<path d="' + d + '" fill="none" stroke="' + o.color + '" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>';
  if (pts.length <= 31) pts.forEach(p => { s += '<circle cx="' + X(p.x).toFixed(1) + '" cy="' + Y(p.y).toFixed(1) + '" r="2.4" fill="' + o.color + '"/>'; });

  s += '<text x="' + L + '" y="' + (H - 6) + '">' + esc(shortDate(o.startKey)) + '</text><text x="' + (W - R) + '" y="' + (H - 6) + '" text-anchor="end">' + esc(shortDate(addDays(o.startKey, o.n - 1))) + '</text>';

}

  try {

    a.href = url; a.download = filename; a.rel = 'noopener';

    done();

    NX.save('main');
    Object.keys(S.days).forEach(k => NX.save('d-' + k));
    oldDays.filter(k => !S.days[k]).forEach(k => NX.save('d-' + k));
    NX.closeSheet('import-ok'); NX.closeSheet('backup', true);
    UI.tab = 'journal'; UI.date = today(); NX.render(); NX.toast('Sauvegarde importée');
  };
});

NX.boot();
})();

</script>
