<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nexafit</title>
<meta name="description" content="Suivi de prise de masse : repas, macros, eau, sommeil, poids et musculation.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nexafit">
<meta name="theme-color" content="#0B0D12">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400..800&family=Manrope:wght@400..800&display=swap">
<style>
:root { color-scheme: dark; padding-top: env(safe-area-inset-top, 0px); }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 25; }
img { max-width: 100%; }
[hidden] { display: none !important; }
.sheet { padding-top: calc(env(safe-area-inset-top, 0px) + 8px); }

/* Layout : une colonne façon appli iPhone, barre d'onglets en bas, feuilles qui montent du bas.
   Thème sombre unique, choisi exprès : fond noir profond, cartes effet verre, accent braise.
   Macros : protéines rose, glucides bleu, lipides jaune. */
:root {
  color-scheme: dark;
  --bg: #0B0D12;
  --surface: #151922;
  --surface-2: #1D222D;
  --hero: #161B25;
  --ink: #F2F4F8;
  --muted: #A3ABBA;
  --faint: #737B8D;
  --line: #262C38;
  --brand: #FF7A45;
  --brand-ink: #0B0D12;
  --prot: #FF5D73;
  --carb: #5B9DFF;
  --fat: #FFC857;
  --water: #5CC8F5;
  --sleep: #A898FF;
  --good: #4ADE95;
  --warn: #FFB347;
  --steel: #F2F4F8;
  --shadow: inset 0 0 0 1px rgba(255,255,255,.07), 0 12px 30px rgba(0,0,0,.35);
  --scrim: rgba(0,0,0,.62);
  --f-display: "Sora", "Manrope", system-ui, sans-serif;
  --f-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 18px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); color: var(--ink); }
body {
  font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px));
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2.5px solid var(--carb); outline-offset: 2px; border-radius: 8px; }
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; padding-top: 14px; }
.num { font-family: var(--f-display); font-variant-numeric: tabular-nums; }
.ico { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ico.sm { width: 18px; height: 18px; }
.ico.fill { fill: currentColor; stroke: none; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.label { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; font-weight: 650; color: var(--muted); }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.h-view { font-family: var(--f-display); font-weight: 700; font-size: 30px; letter-spacing: -.01em; line-height: 1.05; }
.h-sec { font-family: var(--f-display); font-weight: 750; font-size: 18px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.sec { display: flex; flex-direction: column; gap: 10px; }

/* En-tête */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-weight: 800; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; }
.brand-mark { width: 26px; height: 26px; border-radius: 50%; background: var(--brand); display: grid; place-items: center; box-shadow: inset 0 0 0 4px color-mix(in srgb, var(--brand) 70%, #000 30%); }
.brand-mark::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--bg); }
.sync { font-size: 12px; color: var(--faint); display: flex; align-items: center; gap: 6px; }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); display: block; }
.sync.local i { background: var(--warn); }
.sync.busy i { background: var(--carb); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.daynav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.daynav .title { display: flex; flex-direction: column; }
.daynav .sub { font-size: 13px; color: var(--muted); }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--ink); background: var(--surface); box-shadow: var(--shadow); }
.icon-btn:disabled { opacity: .35; }
.icon-btn.plain { background: transparent; box-shadow: none; }
.streak { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 650; color: var(--brand); }

/* Résumé du jour */
.summary { background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); padding: 18px; display: flex; flex-direction: column; gap: 16px; }
.sum-top { display: grid; grid-template-columns: 132px 1fr; gap: 16px; align-items: center; }
.ring { position: relative; width: 132px; height: 132px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .trk { stroke: var(--surface-2); }
.ring .val { stroke: var(--brand); transition: stroke-dashoffset .7s cubic-bezier(.2,.8,.2,1); }
.ring.over .val { stroke: var(--warn); }
.ring-c { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; align-content: center; }
.ring-c b { font-family: var(--f-display); font-weight: 700; font-size: 30px; line-height: 1; }
.ring-c span { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
.kstats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
.kstat { display: flex; flex-direction: column; min-width: 0; }
.kstat b { font-family: var(--f-display); font-weight: 750; font-size: 19px; font-variant-numeric: tabular-nums; }
.kstat span { font-size: 12px; color: var(--muted); }
.macros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.macro { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.macro .mh { display: flex; justify-content: space-between; align-items: baseline; gap: 4px; font-size: 12.5px; }
.macro .mh b { font-family: var(--f-display); font-weight: 750; font-size: 15px; font-variant-numeric: tabular-nums; }
.bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: var(--c, var(--brand)); transition: width .6s cubic-bezier(.2,.8,.2,1); }
.plate-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); display: inline-block; margin-right: 5px; box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--c) 60%, #000 40%); }

/* Barre olympique */
.barbell { width: 100%; height: 56px; display: block; }

/* Check-in du jour */
.checkins { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.chk { background: var(--surface); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 8px; text-align: left; box-shadow: var(--shadow); min-width: 0; }
.chk .ct { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); font-weight: 600; }
.chk .ct .ico { width: 16px; height: 16px; color: var(--c); }
.chk b { font-family: var(--f-display); font-weight: 800; font-size: 20px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.chk b small { font-size: 12px; font-weight: 600; color: var(--muted); font-family: var(--f-body); }
.chk.todo b { color: var(--faint); }
.glasses { display: flex; gap: 2px; flex-wrap: wrap; }
.glasses i { width: 7px; height: 12px; border-radius: 2px 2px 3px 3px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); }
.glasses i.on { background: var(--water); box-shadow: none; }

/* Repas */
.meal { display: flex; flex-direction: column; }
.meal-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 0; }
.meal-h .mt { display: flex; flex-direction: column; min-width: 0; }
.meal-h .mk { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.add-btn { display: inline-flex; align-items: center; gap: 4px; height: 34px; padding: 0 12px 0 8px; border-radius: 99px; background: color-mix(in srgb, var(--brand) 11%, transparent); color: var(--brand); font-weight: 650; font-size: 13.5px; }
.add-btn .ico { width: 18px; height: 18px; stroke-width: 2.2; }
.items { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 11px 14px; width: 100%; text-align: left; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.item:active { background: var(--surface-2); }
.item .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.item .ds { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.item .kc { font-family: var(--f-display); font-weight: 750; font-variant-numeric: tabular-nums; text-align: right; }
.item .kc small { display: block; font-family: var(--f-body); font-weight: 500; font-size: 11.5px; color: var(--faint); }
.item > div { min-width: 0; }
.empty-meal { font-size: 13.5px; color: var(--faint); padding: 2px 0 6px; }
.row-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* Boutons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 20px; border-radius: 14px; background: var(--brand); color: var(--brand-ink); font-weight: 700; font-size: 15.5px; }
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .45; }
.btn.block { width: 100%; }
.btn.ghost { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.btn.soft { background: var(--surface-2); color: var(--ink); }
.btn.danger { background: transparent; color: var(--brand); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--brand) 40%, transparent); }
.btn.sm { height: 38px; padding: 0 14px; font-size: 14px; border-radius: 11px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 13px; border-radius: 99px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); font-size: 13.5px; font-weight: 600; white-space: nowrap; }
.chip.on { background: var(--ink); color: var(--bg); box-shadow: none; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.seg { display: flex; background: var(--surface); border-radius: 12px; padding: 3px; gap: 3px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); }
.seg button { flex: 1; min-height: 36px; padding: 4px 6px; border-radius: 9px; font-size: 13.5px; font-weight: 650; color: var(--muted); transition: background .18s, color .18s, box-shadow .18s; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
.seg button.on { background: rgba(255,122,69,.16); color: var(--brand); box-shadow: inset 0 0 0 1.5px rgba(255,122,69,.6); }

/* Champs */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.inp { height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); padding: 0 13px; width: 100%; min-width: 0; font-size: 16px; }
.inp:focus { border-color: var(--carb); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--carb) 18%, transparent); }
textarea.inp { height: auto; min-height: 92px; padding: 11px 13px; resize: vertical; line-height: 1.45; }
select.inp { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.search { position: relative; }
.search .ico { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--faint); }
.search .inp { padding-left: 42px; }
.stepper { display: flex; align-items: center; gap: 10px; }
.stepper button { width: 46px; height: 46px; border-radius: 12px; background: var(--surface-2); font-size: 22px; font-weight: 600; display: grid; place-items: center; }
.stepper .inp { text-align: center; font-family: var(--f-display); font-weight: 750; font-size: 20px; }

/* Listes génériques */
.list { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.li { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-top: 1px solid var(--line); width: 100%; text-align: left; min-height: 54px; }
.li:first-child { border-top: 0; }
.li:active { background: var(--surface-2); }
.li .lt { flex: 1; min-width: 0; }
.li .lt b { display: block; font-weight: 620; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .lt span { display: block; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .rt { font-family: var(--f-display); font-weight: 750; font-variant-numeric: tabular-nums; flex: none; text-align: right; }
.li .lic { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); color: var(--ink); flex: none; }
.li .chev { color: var(--faint); }
.group-label { padding: 14px 2px 6px; }
.note { font-size: 13px; color: var(--muted); line-height: 1.5; }
.callout { background: var(--surface-2); border-radius: 14px; padding: 12px 14px; font-size: 13.5px; color: var(--muted); line-height: 1.5; }
.callout b { color: var(--ink); }
.tag { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 6px; font-size: 11px; font-weight: 700; letter-spacing: .03em; background: var(--surface-2); color: var(--muted); }
.tag.pr { background: color-mix(in srgb, var(--fat) 22%, transparent); color: color-mix(in srgb, var(--fat) 55%, var(--ink)); }
.tag.ai { background: color-mix(in srgb, var(--sleep) 16%, transparent); color: var(--sleep); }

/* Onglets */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: rgba(11,13,18,.9); backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4); border-top: 1px solid var(--line);
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-bottom: max(8px, env(safe-area-inset-bottom, 0px)); padding-top: 6px; }
.tabs-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10.5px; font-weight: 650; color: var(--faint); padding: 4px 0; letter-spacing: .02em; }
.tab.on { color: var(--ink); }
.tab .ico { width: 24px; height: 24px; }
.fab { justify-self: center; width: 56px; height: 56px; border-radius: 50%; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; margin-top: -22px; box-shadow: 0 6px 18px color-mix(in srgb, var(--brand) 45%, transparent), inset 0 0 0 5px color-mix(in srgb, var(--brand) 78%, #000 22%); }
.fab .ico { width: 26px; height: 26px; stroke-width: 2.4; }
.fab:active { transform: scale(.94); }

/* Feuilles (bottom sheets) */
.sheet { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; justify-content: flex-end; }
.sheet .scrim { position: absolute; inset: 0; background: var(--scrim); animation: fade .2s ease; }
.sheet .panel { position: relative; background: #0F1218; box-shadow: inset 0 1px 0 rgba(255,255,255,.08); border-radius: 22px 22px 0 0; max-height: 94%; display: flex; flex-direction: column; animation: up .28s cubic-bezier(.2,.8,.2,1); width: 100%; max-width: 600px; margin: 0 auto;
  padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet.full .panel { height: 94%; }
.panel-h { display: flex; align-items: center; gap: 10px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
.panel-h::before { content: ""; position: absolute; top: 7px; left: 50%; width: 38px; height: 5px; margin-left: -19px; border-radius: 9px; background: var(--line); }
.panel-h h2 { flex: 1; font-family: var(--f-display); font-weight: 800; font-size: 20px; padding-top: 12px; min-width: 0; }
.panel-h .icon-btn { margin-top: 10px; }
.panel-b { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 6px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 16px; flex: 1; overscroll-behavior: contain; }
.panel-f { padding: 10px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); border-top: 1px solid var(--line); background: #0F1218; display: flex; gap: 10px; }
.panel-f .btn { flex: 1; }
@keyframes up { from { transform: translateY(100%); } }
@keyframes fade { from { opacity: 0; } }
.sheet.closing .panel { transform: translateY(100%); transition: transform .2s ease-in; }
.sheet.closing .scrim { opacity: 0; transition: opacity .2s; }

/* Toast */
.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); z-index: 80; background: var(--ink); color: var(--bg); padding: 11px 16px; border-radius: 14px; font-weight: 600; font-size: 14px; opacity: 0; pointer-events: none; transition: .25s; max-width: calc(100% - 32px); display: flex; align-items: center; gap: 10px; box-shadow: var(--shadow); }
.toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast button { color: var(--fat); font-weight: 700; }

/* Chrono de repos */
.timer { position: fixed; z-index: 40; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); width: min(528px, calc(100% - 32px)); background: var(--hero); color: var(--ink); border-radius: 18px; padding: 10px 10px 10px 16px; border: 1px solid var(--line); display: flex; align-items: center; gap: 10px; box-shadow: var(--shadow); overflow: hidden; }
.timer .tprog { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--brand); transition: width 1s linear; }
.timer b { font-family: var(--f-display); font-weight: 700; font-size: 24px; font-variant-numeric: tabular-nums; min-width: 64px; }
.timer .tl { flex: 1; font-size: 12.5px; opacity: .75; min-width: 0; }
.timer button { height: 36px; min-width: 44px; padding: 0 10px; border-radius: 10px; background: rgba(255,255,255,.08); color: var(--ink); font-weight: 700; font-size: 13px; }
.timer.done { background: var(--good); color: #0B0D12; }
.timer.done button { color: #0B0D12; background: rgba(0,0,0,.12); }

/* Muscu */
.session-h { background: var(--hero); color: var(--ink); box-shadow: var(--shadow); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.session-h .h-sec { color: var(--ink); }
.session-h .ss { display: flex; gap: 18px; font-size: 12.5px; opacity: .8; flex-wrap: wrap; }
.session-h .ss b { font-family: var(--f-display); font-size: 17px; display: block; opacity: 1; font-variant-numeric: tabular-nums; }
.exo { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.exo-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.exo-h b { font-family: var(--f-display); font-weight: 750; font-size: 16.5px; }
.exo-h .prev { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.sets { display: flex; flex-direction: column; gap: 6px; }
.set { display: grid; grid-template-columns: 30px 1fr 1fr 46px; gap: 8px; align-items: center; }
.set .n { font-family: var(--f-display); font-weight: 750; color: var(--faint); text-align: center; font-size: 14px; }
.set .inp { height: 42px; text-align: center; font-family: var(--f-display); font-weight: 700; font-size: 17px; padding: 0 6px; }
.set .ok { width: 46px; height: 42px; border-radius: 11px; background: var(--surface-2); color: var(--faint); display: grid; place-items: center; }
.set.done .ok { background: var(--good); color: #fff; }
.set.done .inp { background: color-mix(in srgb, var(--good) 8%, var(--surface)); border-color: color-mix(in srgb, var(--good) 30%, var(--line)); }
.set-h { display: grid; grid-template-columns: 30px 1fr 1fr 46px; gap: 8px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); text-align: center; }
.prog-card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.prog-days { display: flex; flex-direction: column; gap: 8px; }
.prog-day { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); width: 100%; text-align: left; }
.prog-day .lt { flex: 1; min-width: 0; }
.prog-day .lt b { display: block; font-weight: 650; }
.prog-day .lt span { display: block; font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.play { width: 38px; height: 38px; border-radius: 50%; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; flex: none; }
.play .ico { width: 16px; height: 16px; }

/* Graphiques */
.chart-card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.chart-card .cv { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.chart-card .cv b { font-family: var(--f-display); font-weight: 700; font-size: 26px; font-variant-numeric: tabular-nums; }
.delta { font-size: 13px; font-weight: 650; }
.delta.up { color: var(--good); } .delta.down { color: var(--brand); } .delta.flat { color: var(--muted); }
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--faint); font-size: 10px; font-family: var(--f-body); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart-empty { height: 120px; display: grid; place-items: center; text-align: center; color: var(--faint); font-size: 13.5px; border: 1.5px dashed var(--line); border-radius: 12px; padding: 12px; }
.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 12px; min-width: 0; }
.stat b { display: block; font-family: var(--f-display); font-weight: 800; font-size: 19px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }

/* Accueil */
.welcome { display: flex; flex-direction: column; gap: 18px; padding-top: 10px; }
.welcome .hero { font-family: var(--f-display); font-weight: 800; font-size: clamp(34px, 10vw, 46px); line-height: .98; letter-spacing: -.015em; text-transform: uppercase; }
.welcome .hero em { font-style: normal; color: var(--brand); }
.plates-row { display: flex; align-items: center; gap: 0; height: 64px; }
.plates-row i { display: block; border-radius: 4px; margin-right: 3px; }
.res-goal { background: var(--hero); color: var(--ink); box-shadow: var(--shadow); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.res-goal .big { font-family: var(--f-display); font-weight: 800; font-size: 34px; font-variant-numeric: tabular-nums; line-height: 1; }
.res-goal .mm { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; }
.res-goal .mm b { font-family: var(--f-display); font-size: 17px; }

.check { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); width: 100%; text-align: left; }
.check:first-child { border-top: 0; }
.check .box { width: 24px; height: 24px; border-radius: 7px; box-shadow: inset 0 0 0 2px var(--line); display: grid; place-items: center; flex: none; color: transparent; }
.check.on .box { background: var(--good); box-shadow: none; color: #fff; }
.check.on .lt b { text-decoration: line-through; color: var(--faint); }
.check .lt { flex: 1; min-width: 0; }
.check .lt b { font-weight: 600; display: block; }
.check .lt span { font-size: 12.5px; color: var(--muted); }

.loading { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; }
.spin { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid var(--line); border-top-color: var(--brand); animation: rot .8s linear infinite; flex: none; }
@keyframes rot { to { transform: rotate(360deg); } }
.pop { animation: popin .35s cubic-bezier(.2,1.4,.4,1); }
@keyframes popin { from { transform: scale(.85); opacity: .4; } }

/* En-tête : réglages */
.tb-r { display: flex; align-items: center; gap: 2px; }
.tb-r .icon-btn { width: 36px; height: 36px; }
/* les blocs d'une feuille ne se tassent jamais */
.panel-b > * { flex-shrink: 0; }
/* compléments */
.supp-card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 12px; display: flex; flex-direction: column; gap: 10px; transition: box-shadow .3s; }
.supp-card.all { box-shadow: inset 0 0 0 1px rgba(74,222,149,.35), 0 12px 30px rgba(0,0,0,.35); }
.supp-card .ct { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); font-weight: 600; }
.supp-card .ct .ico { color: var(--good); }
.supp-n { font-size: 12.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
.supp-n b { color: var(--ink); font-family: var(--f-display); font-size: 15px; }
.supp-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.supp { display: flex; align-items: center; gap: 9px; min-height: 48px; padding: 7px 10px 7px 8px; border-radius: 14px; background: var(--surface-2); text-align: left; transition: background .2s, box-shadow .2s, transform .12s; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
.supp:active { transform: scale(.97); }
.supp .sb { width: 24px; height: 24px; flex: none; border-radius: 50%; display: grid; place-items: center; box-shadow: inset 0 0 0 1.5px var(--faint); color: transparent; transition: background .2s, color .2s, box-shadow .2s; }
.supp .sb .ico { width: 14px; height: 14px; stroke-width: 3; }
.supp .sn { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.supp .sn b { font-size: 13.5px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.supp .sn span { font-size: 11.5px; color: var(--faint); }
.supp .ss { display: flex; align-items: center; gap: 2px; font-size: 12px; font-weight: 700; color: var(--brand); font-variant-numeric: tabular-nums; }
.supp .ss .ico { width: 13px; height: 13px; }
.supp.on { background: rgba(74,222,149,.1); box-shadow: inset 0 0 0 1px rgba(74,222,149,.35); }
.supp.on .sb { background: var(--good); color: #0B0D12; box-shadow: none; animation: pop .28s cubic-bezier(.3,1.6,.5,1); }
@keyframes pop { 0% { transform: scale(.6); } 100% { transform: scale(1); } }
/* bilan de la semaine */
.rev-banner { display: flex; align-items: center; gap: 4px; background: linear-gradient(120deg, rgba(255,122,69,.16), rgba(255,93,115,.08)); border-radius: var(--r); box-shadow: inset 0 0 0 1px rgba(255,122,69,.35); padding-right: 6px; }
.rv-main, .rev-link { flex: 1; display: flex; align-items: center; gap: 12px; padding: 12px 6px 12px 12px; text-align: left; min-width: 0; color: var(--ink); }
.rev-link { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 12px 14px; width: 100%; }
.rv-main .lt, .rev-link .lt { flex: 1; min-width: 0; }
.rv-main .lt b, .rev-link .lt b { display: block; font-weight: 700; }
.rv-main .lt span, .rev-link .lt span { display: block; font-size: 12.5px; color: var(--muted); }
.rh-i { width: 38px; height: 38px; border-radius: 12px; flex: none; display: grid; place-items: center; background: rgba(255,122,69,.16); color: var(--brand); }
.rev-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.rev-nav b { font-family: var(--f-display); font-weight: 700; font-size: 15px; text-align: center; }
.rev-hero { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: var(--r); background: color-mix(in srgb, var(--c) 10%, var(--surface)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 35%, transparent); }
.rev-hero .rh-i { background: color-mix(in srgb, var(--c) 18%, transparent); color: var(--c); }
.rev-hero b { font-family: var(--f-display); font-size: 18px; font-weight: 750; }
.rev-hero p { margin: 4px 0 0; font-size: 13.5px; color: var(--muted); line-height: 1.45; }
.rev-bars { position: relative; display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; height: 150px; padding: 18px 10px 26px; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); }
.rb { position: relative; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
.rb i { display: block; width: 100%; max-width: 26px; border-radius: 7px 7px 4px 4px; background: var(--faint); min-height: 3px; transform-origin: bottom; animation: grow .5s cubic-bezier(.3,.7,.2,1) both; }
.rb.ok i { background: var(--good); } .rb.low i { background: var(--carb); } .rb.high i { background: var(--warn); } .rb.none i, .rb.off i { background: var(--surface-2); }
.rb .rv { font-size: 10px; color: var(--faint); margin-bottom: 3px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.rb .rl { position: absolute; bottom: -20px; font-size: 11px; font-weight: 700; color: var(--muted); }
.rev-bars .rg { position: absolute; left: 10px; right: 10px; bottom: calc(26px + (100% - 44px) * var(--goal) / 100); border-top: 1.5px dashed rgba(242,244,248,.45); pointer-events: none; }
@keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
.rev-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.rvt { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.rvt span { font-size: 12px; color: var(--muted); }
.rvt b { font-family: var(--f-display); font-weight: 800; font-size: 20px; font-variant-numeric: tabular-nums; }
.rvt small { font-size: 11.5px; color: var(--faint); }
/* disques */
.pl-top { display: flex; align-items: center; gap: 10px; justify-content: center; }
.pl-w { position: relative; width: 150px; }
.pl-w .inp { height: 60px; text-align: center; font: 800 30px/1 var(--f-display); padding: 0 34px 0 10px; }
.pl-w span { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-weight: 650; }
.pl-top .icon-btn { width: 52px; height: 52px; border-radius: 16px; }
.pl-vis { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 10px 10px 14px; display: flex; flex-direction: column; gap: 6px; }
.pl-svg { width: 100%; height: auto; display: block; }
.pl-p { transform-box: fill-box; transform-origin: center; animation: plIn .32s cubic-bezier(.3,1.4,.5,1) both; }
@keyframes plIn { from { opacity: 0; transform: scaleY(.4); } to { opacity: 1; transform: none; } }
.pl-res { display: flex; flex-direction: column; align-items: center; gap: 3px; text-align: center; }
.pl-res b { font: 800 22px/1.2 var(--f-display); }
.pl-warn { font-size: 12.5px; color: var(--warn); }
.pl-av { display: flex; flex-wrap: wrap; gap: 8px; }
.pl-chip { display: flex; align-items: center; gap: 7px; height: 36px; padding: 0 12px 0 9px; border-radius: 99px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); font-weight: 650; font-size: 13.5px; color: var(--faint); transition: all .18s; }
.pl-chip i { width: 14px; height: 14px; border-radius: 50%; background: var(--pc); opacity: .35; box-shadow: inset 0 0 0 1px rgba(255,255,255,.2); }
.pl-chip.on { color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--pc); }
.pl-chip.on i { opacity: 1; }
.li.wu { min-height: 50px; }
.wu-n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font-size: 12.5px; font-weight: 700; color: var(--muted); flex: none; }
.li.wu.main .wu-n { background: rgba(255,122,69,.16); color: var(--brand); }
/* carte des muscles */
.mm { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 12px 6px 6px; }
.mm figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.mm svg { width: 100%; max-width: 170px; height: auto; display: block; overflow: visible; }
.mm figcaption { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); font-weight: 650; padding-bottom: 4px; }
.mm .base { fill: #1E2430; }
.mu { stroke: var(--surface); stroke-width: 1.4; stroke-linejoin: round; cursor: pointer; transition: fill .4s ease, filter .3s; -webkit-tap-highlight-color: transparent; }
.mu.lv-none, .mm-leg i.lv-none { fill: #2C3341; background: #2C3341; }
.mu.lv-low, .mm-leg i.lv-low { fill: #5E3B2E; background: #5E3B2E; }
.mu.lv-mid, .mm-leg i.lv-mid { fill: #B8552F; background: #B8552F; }
.mu.lv-good, .mm-leg i.lv-good { fill: #FF7A45; background: #FF7A45; }
.mu.lv-high, .mm-leg i.lv-high { fill: #FF5D73; background: #FF5D73; }
.mu.lv-good, .mu.lv-high { filter: drop-shadow(0 0 4px rgba(255,122,69,.45)); }
.mu.sel { stroke: #F2F4F8; stroke-width: 1.8; }
.mm-leg { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.mm-leg span { display: flex; align-items: center; gap: 5px; }
.mm-leg i { width: 12px; height: 12px; border-radius: 4px; display: block; }
.mm-leg em { font-style: normal; color: var(--faint); margin-left: auto; }
.mm-sum { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mm-sum div { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.mm-sum .faint { font-size: 12px; }
.mm-sum b { font-size: 14px; }
.mm-det { background: var(--surface); border-radius: var(--r); box-shadow: inset 3px 0 0 var(--lc, var(--faint)), var(--shadow); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; animation: fadeUp .25s ease both; }
.mm-det.lv-low { --lc: #8A5440; } .mm-det.lv-mid { --lc: #B8552F; } .mm-det.lv-good { --lc: #FF7A45; } .mm-det.lv-high { --lc: #FF5D73; }
.mm-det .sec-head b { font-family: var(--f-display); font-size: 17px; }
.mm-v { font-weight: 700; color: var(--brand); font-variant-numeric: tabular-nums; }
.mm-ex { display: flex; flex-wrap: wrap; gap: 6px; }
.mm-ex span { font-size: 12.5px; background: var(--surface-2); border-radius: 99px; padding: 4px 10px; color: var(--muted); }
.mm-ex b { color: var(--ink); }
@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .supp.on .sb, .rb i, .pl-p, .mm-det { animation: none; } .mu { transition: none; } }
/* menu de la semaine */
.plan-hero { background: radial-gradient(120% 90% at 100% 0%, rgba(255,122,69,.18), transparent 60%), var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px 16px; display: flex; flex-direction: column; gap: 12px; }
.plan-hero b { font: 750 20px/1.2 var(--f-display); }
.plan-hero p { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.5; }
.ph-i { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: rgba(255,122,69,.16); color: var(--brand); }
.plan-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.pd { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0; border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); color: var(--muted); transition: background .18s, color .18s, box-shadow .18s; -webkit-tap-highlight-color: transparent; }
.pd span { font-size: 11px; font-weight: 650; text-transform: capitalize; }
.pd b { font: 750 16px/1 var(--f-display); color: var(--ink); }
.pd.td span { color: var(--brand); }
.pd.on { background: rgba(255,122,69,.16); box-shadow: inset 0 0 0 1.5px rgba(255,122,69,.6); }
.pd.on b { color: var(--brand); }
.plan-tot { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 12px; }
.pm { position: relative; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.pm span { font-size: 11.5px; color: var(--muted); font-weight: 600; }
.pm b { font: 750 15px/1.1 var(--f-display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pm b small { font: 600 10.5px var(--f-body); color: var(--faint); }
.pm em { position: absolute; top: 0; right: 0; color: var(--good); }
.pm em .ico { width: 13px; height: 13px; stroke-width: 3; }
.plan-meal { display: flex; flex-direction: column; gap: 8px; }
.plan-meal h3 { margin: 0; font: 700 15px var(--f-display); }
.plan-meal .li .ico:last-child { color: var(--faint); }
.chat { display: flex; flex-direction: column; gap: 10px; padding-bottom: 6px; }
.msg { max-width: 88%; display: flex; flex-direction: column; gap: 8px; font-size: 14.5px; line-height: 1.5; animation: fadeUp .22s ease both; }
.msg p { margin: 0; }
.msg.me { align-self: flex-end; background: var(--brand); color: var(--brand-ink); padding: 9px 14px; border-radius: 18px 18px 6px 18px; font-weight: 550; }
.msg.bot { align-self: flex-start; background: var(--surface); box-shadow: var(--shadow); padding: 12px 14px; border-radius: 18px 18px 18px 6px; color: var(--ink); }
.msg.bot .mt { font-family: var(--f-display); font-size: 15.5px; }
.msg.bot ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.msg.bot ol li::marker { color: var(--brand); font-weight: 700; }
.mact { display: flex; flex-wrap: wrap; gap: 6px; }
.mact .chip { height: auto; min-height: 34px; padding: 6px 12px; white-space: normal; text-align: left; }
.diag { display: flex; flex-direction: column; border-radius: 12px; background: var(--surface-2); overflow: hidden; }
.diag div { display: flex; justify-content: space-between; gap: 10px; padding: 7px 10px; font-size: 13px; border-top: 1px solid var(--line); }
.diag div:first-child { border-top: 0; }
.diag span { color: var(--muted); }
.typing { display: flex; gap: 4px; padding: 4px 2px; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: dots 1s infinite ease-in-out; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes dots { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
.chat-in { display: flex; gap: 8px; width: 100%; }
.chat-in .inp { flex: 1; border-radius: 99px; padding: 0 16px; }
.chat-in .send { width: 46px; height: 46px; border-radius: 50%; background: var(--brand); color: var(--brand-ink); box-shadow: none; flex: none; }
/* coach de séance */
.coach { display: flex; gap: 8px; align-items: flex-start; margin-top: 8px; padding: 8px 10px; border-radius: 12px; background: rgba(255,122,69,.1); box-shadow: inset 0 0 0 1px rgba(255,122,69,.3); color: var(--brand); }
.coach.k-down { background: rgba(91,157,255,.1); box-shadow: inset 0 0 0 1px rgba(91,157,255,.3); color: var(--carb); }
.coach .ico { flex: none; margin-top: 2px; }
.coach span { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.coach b { font-size: 13.5px; color: var(--ink); font-variant-numeric: tabular-nums; }
.coach small { font-size: 12px; color: var(--muted); }
/* séance du jour, planning */
.today { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--surface); border-radius: var(--r); box-shadow: inset 0 0 0 1px rgba(255,122,69,.3), var(--shadow); }
.today .lt { flex: 1; min-width: 0; } .today .lt > b { display: block; font-weight: 700; } .today .lt > span { display: block; font-size: 12.5px; color: var(--muted); }
.today.ok { box-shadow: inset 0 0 0 1px rgba(74,222,149,.3), var(--shadow); } .today.ok .rh-i { background: rgba(74,222,149,.14); color: var(--good); }
.today.rest { box-shadow: var(--shadow); } .today.rest .rh-i { background: rgba(168,152,255,.14); color: var(--sleep); }
.today .btn.sm { flex: none; }
.wk-strip { display: grid; grid-template-columns: repeat(7, 1fr) 36px; gap: 4px; align-items: center; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 10px 6px 10px 10px; }
.wk { display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 0; }
.wk span { font-size: 11px; font-weight: 700; color: var(--faint); }
.wk.td span { color: var(--brand); }
.wk i { width: 22px; height: 22px; border-radius: 50%; display: block; background: var(--surface-2); }
.wk.plan i { box-shadow: inset 0 0 0 2px var(--brand); background: transparent; }
.wk.done i { background: var(--brand); box-shadow: 0 0 10px rgba(255,122,69,.5); }
.wk.miss i { box-shadow: inset 0 0 0 2px var(--line); background: transparent; }
.wk small { font-size: 10px; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-height: 12px; }
.sched .li { gap: 10px; }

/* ---------- traduction d'un texte ---------- */
const cache = new Map();
function tr(s) {
  if (lang === 'fr' || !s) return null;
  const key = lang + '\u0001' + s;
  if (cache.has(key)) return cache.get(key);
  let r = null;
  const d = D.get(s);
  if (d) r = d[E() ? 0 : 1];
  else {
    for (const [re, fn] of P) { const m = s.match(re); if (m) { r = fn(m); if (r != null) break; } }
    if (r == null && s.includes(' · ')) {
      let ch = false; const o = s.split(' · ').map(p => { const x = tr(p); if (x != null) { ch = true; return x; } return p; });
      if (ch) r = o.join(' · ');
    }
    if (r == null && /[.!?] [A-ZÀ-ÖØ-Þ«\d]/.test(s)) {
      let ch = false; const o = s.split(/(?<=[.!?])\s+(?=[A-ZÀ-ÖØ-Þ«\d])/).map(p => { const x = tr(p); if (x != null) { ch = true; return x; } return p; });
      if (ch) r = o.join(' ');
    }
    if (r == null && s.includes(', ')) {
      const parts = s.replace(/…$/, '').split(', ');
      if (!/[:.!?]/.test(s.replace(/…$/, '')) && parts.every(p => p.split(' ').length <= 5) && parts.some(p => D.has(p))) r = parts.map(p => D.has(p) ? D.get(p)[E() ? 0 : 1] : p).join(', ') + (s.endsWith('…') ? '…' : '');
    }
    if (r == null && s.startsWith('· ')) { const x = tr(s.slice(2)); if (x != null) r = '· ' + x; }
  }
  if (cache.size > 5000) cache.clear();
  cache.set(key, r);
  return r;
}

/* ---------- traduction de la page ---------- */
const ATTRS = ['placeholder', 'aria-label', 'title'];
const SKIP = { STYLE: 1, SCRIPT: 1, TEXTAREA: 1, svg: 1, SVG: 1 };
const done = new WeakMap();
function trText(n) {
  const p = n.parentNode;
  if (!p || SKIP[p.nodeName] || (p.closest && p.closest('[data-notr]'))) return;
  const raw = n.nodeValue;
  if (done.get(n) === raw) return;
  const s = raw.trim();
  if (!s || !/[A-Za-zÀ-ÿ]/.test(s)) return;
  const r = tr(s);
  if (r != null && r !== s) { const out = raw.replace(s, r); done.set(n, out); n.nodeValue = out; }
}
function trEl(el) {
  if (el.closest && el.closest('[data-notr]')) return;
  for (const a of ATTRS) { const v = el.getAttribute(a); if (v) { const r = tr(v.trim()); if (r != null) el.setAttribute(a, r); } }
}
function walk(root) {
  if (lang === 'fr' || !root) return;
  if (root.nodeType === 3) return trText(root);
  if (root.nodeType !== 1 || SKIP[root.nodeName]) return;
  trEl(root);
  const w = document.createTreeWalker(root, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT);
  let x;
  while ((x = w.nextNode())) { if (x.nodeType === 3) trText(x); else trEl(x); }
}
let observer = null;
function start() {
  if (observer || !document.body) return;
  observer = new MutationObserver(ms => { if (lang === 'fr') return; for (const m of ms) { if (m.type === 'characterData') trText(m.target); else m.addedNodes.forEach(walk); } });
  observer.observe(document.body, { childList: true, subtree: true, characterData: true });
  walk(document.body);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();

/* ---------- API ---------- */
window.NXI = {
  LANGS,
  get lang() { return lang; },
  locale: () => LANGS[lang][1],
  set(l) {
    if (!LANGS[l]) return;
    lang = l;
    try { localStorage.setItem('nexafit-lang', l); } catch (e) { }
    document.documentElement.lang = l;
  },
  tr, T,
  // phrase complète avec variables : t('Encore {kg} à prendre…', {kg: '…'})
  t(fr, vars) {
    let s = fr;
    if (lang !== 'fr') { const d = D.get(fr); if (d) s = d[E() ? 0 : 1]; }
    if (vars) for (const k in vars) s = s.split('{' + k + '}').join(vars[k]);
    return s;
  },
  addTemplates: rows => add(rows),
  searchText: name => { const f = D.get(name); return f ? f.join(' ') : ''; },
  walk
};

const fmt = (n, d = 0) => (n == null || !isFinite(n)) ? '–' : Number(n).toLocaleString(LOC(), { maximumFractionDigits: d, minimumFractionDigits: 0 });

const pad = n => String(n).padStart(2, '0');
const dateKey = (d = new Date()) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const keyToDate = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = keyToDate(k); d.setDate(d.getDate() + n); return dateKey(d); };
const today = () => dateKey();

const shortDate = k => { const d = keyToDate(k); if (LOC() !== 'fr-FR') return d.toLocaleDateString(LOC(), { day: 'numeric', month: 'short' }); return d.getDate() + ' ' + MONTHS[d.getMonth()]; };
const longDate = k => { const d = keyToDate(k); if (LOC() !== 'fr-FR') return d.toLocaleDateString(LOC(), { weekday: 'long', day: 'numeric', month: 'long' }); return DAYS_L[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS_L[d.getMonth()]; };

let FOOD_CACHE = null, FOOD_SIG = '';
NX.allFoods = () => {

  if (FOOD_CACHE && sig === FOOD_SIG) return FOOD_CACHE;
  const out = [];
  for (const f of S.main.recipes) {
    const t = NX.recipeTotals(f);
    const w = f.weight || t.g || 1;
    out.push({ id: f.id, kind: 'recipe', name: f.name, cat: 'Mes recettes', per: { k: t.k / w * 100, p: t.p / w * 100, c: t.c / w * 100, f: t.f / w * 100 }, unit: ['portion', w / Math.max(1, f.servings || 1)] });
  }
  for (const f of S.main.foods) out.push({ id: f.id, kind: 'mine', name: f.name, brand: f.brand, cat: 'Mes aliments', per: f.per, price: f.price && f.price.kg > 0 ? f.price : null, unit: f.unit && f.unit[1] ? f.unit : null, ai: f.ai, src: f.src });
  (window.NX_FOODS || []).forEach(r => out.push({ id: 'db:' + norm(r[0] + (r[10] ? ' ' + r[10] : '')), kind: 'db', name: r[0], brand: r[10] || '', cat: r[1], per: { k: r[2], p: r[3], c: r[4], f: r[5] }, unit: r[7] ? [r[6], r[7]] : null, price: r[8] > 0 ? { kg: r[8], pack: r[9] || 0 } : null, raw: r[11] || null }));
  out.forEach(f => { f._n = norm(f.name + ' ' + (f.brand || '')); if (f.kind === 'db' && window.NXI && NXI.lang !== 'fr') f._t = norm(NXI.searchText(f.name)); });
  FOOD_CACHE = out; FOOD_SIG = sig;
  return out;
};
NX.foodById = id => NX.allFoods().find(f => f.id === id) || null;
let NAME_MAP = null, NAME_SIG = '';
NX.foodByName = name => {
  const all = NX.allFoods();
  if (!NAME_MAP || NAME_SIG !== FOOD_SIG) {
    NAME_MAP = {};
    for (const f of all) {
      const a = norm(f.name + (f.brand ? ' · ' + f.brand : ''));
      if (!NAME_MAP[a]) NAME_MAP[a] = f;
      if (!f.brand && !NAME_MAP[norm(f.name)]) NAME_MAP[norm(f.name)] = f;
    }

  }

};
NX.priceOf = f => {
  if (!f) return null;
  const o = S.main.prices && S.main.prices[f.id];
  if (o && o.kg > 0) return { kg: o.kg, pack: o.pack || 0 };
  return f.price && f.price.kg > 0 ? f.price : null;
};
const STAPLES = new Set(["filet de poulet cru", "filet de poulet cuit", "riz blanc cuit", "riz basmati cuit", "pates cuites", "oeuf entier", "steak hache 5 % cuit", "thon au naturel (egoutte)", "flocons d'avoine", "lait demi-ecreme", "banane", "pomme", "fromage blanc 3 %", "skyr nature", "whey proteine", "beurre de cacahuete", "pomme de terre cuite", "saumon cuit", "escalope de dinde cuite", "yaourt nature", "huile d'olive", "pain complet", "baguette"]);
NX.searchFoods = q => {
  const words = norm(q).split(/\s+/).filter(Boolean);
  if (!words.length) return [];
  const res = [];
  for (const f of NX.allFoods()) {
    const hay = f._t ? f._n + ' | ' + f._t : f._n;
    if (!words.every(w => hay.includes(w))) continue;
    let s = 0;
    if (f._n.startsWith(words[0]) || (f._t && (f._t.startsWith(words[0]) || f._t.includes(' ' + words[0])))) s += 3;
    else if (new RegExp('(^|[\\s\'-])' + words[0].replace(/[.*+?^${}()|[\]\\]/g, '')).test(f._n)) s += 1;
    if (['Féculents', 'Volaille', 'Viandes', 'Poissons & fruits de mer', 'Œufs', 'Produits laitiers', 'Céréales petit-déj'].includes(f.cat)) s += 0.6;
    if (f.kind === 'db' && !f.brand) s += 0.4;
    if (STAPLES.has(f._n)) s += 2.5;
    if (f.cat === 'Fast-food & resto' || f.cat === 'Plats préparés') s -= 1;
    if (f.kind !== 'db') s += 2;
    if (S.main.fav.includes(f.id)) s += 2;
    if (S.main.recent.some(r => r.fid === f.id)) s += 1;
    s -= f.name.length / 60;
    res.push([s, f]);
  }
  return res.sort((a, b) => b[0] - a[0]).slice(0, 50).map(x => x[1]);
};
NX.macrosOf = (per, g) => ({ k: per.k * g / 100, p: per.p * g / 100, c: per.c * g / 100, f: per.f * g / 100 });
NX.entryTotals = e => NX.macrosOf(e.per, e.g);
NX.dayTotals = day => {
  const t = { k: 0, p: 0, c: 0, f: 0, n: 0 };

  return t;
};
NX.mealTotals = list => list.reduce((t, e) => { const x = NX.entryTotals(e); t.k += x.k; t.p += x.p; t.c += x.c; t.f += x.f; return t; }, { k: 0, p: 0, c: 0, f: 0 });
NX.recipeTotals = r => (r.items || []).reduce((t, it) => { const x = NX.macrosOf(it.per, it.g); t.k += x.k; t.p += x.p; t.c += x.c; t.f += x.f; t.g += it.g; return t; }, { k: 0, p: 0, c: 0, f: 0, g: 0 });
NX.gramsLabel = (g, unit) => {

};

};

  let best = 0, bestSet = null;
  for (const w of NX.allWorkouts()) { if (w.id === excludeId) continue; for (const e of w.exercises) if (e.ex === ex) for (const s of e.sets) if (s.done) { const v = NX.e1rm(s.w, s.r); if (v > best) { best = v; bestSet = s; } } }

};

/* ---------- objectifs ---------- */
const ACTIVITY = [[1.2, 'Sédentaire', 'Bureau, peu de marche'], [1.375, 'Légèrement actif', '1 à 3 séances par semaine'], [1.55, 'Actif', '3 à 5 séances par semaine'], [1.725, 'Très actif', '6 séances ou travail physique'], [1.9, 'Extrêmement actif', 'Sport intense tous les jours']];
const GOALS = { lean: ['Prise de masse sèche', 250], bulk: ['Prise de masse', 450], slim: ['Perte de poids douce', -300], cut: ['Perte de poids', -500], keep: ['Maintien', 0] };
NX.ACTIVITY = ACTIVITY; NX.GOALS = GOALS;
const isLoss = g => g === 'cut' || g === 'slim';
NX.isLoss = () => !!(S.main.profile && isLoss(S.main.profile.goal));
NX.calcGoals = p => {
  const w = num(p.weight), h = num(p.height), a = num(p.age);
  if (!w || !h || !a) return null;
  const bmr = 10 * w + 6.25 * h - 5 * a + (p.sex === 'f' ? -161 : 5);
  const tdee = bmr * num(p.activity || 1.55);
  // plancher de sécurité : jamais sous le métabolisme de base ni sous 1 200 / 1 500 kcal
  const floor = Math.max(bmr, p.sex === 'f' ? 1200 : 1500);
  let k = Math.round((tdee + (GOALS[p.goal] || GOALS.bulk)[1]) / 10) * 10, floored = false;
  if (isLoss(p.goal) && k < floor) { k = Math.round(floor / 10) * 10; floored = true; }
  // en perte de poids : protéines hautes pour garder le muscle, calculées sur un poids de référence (IMC 25 max)
  const refW = isLoss(p.goal) ? Math.min(w, 25 * (h / 100) * (h / 100)) : w;
  const pg = Math.round(refW * (isLoss(p.goal) ? 2.1 : p.goal === 'keep' ? 1.8 : 2));
  const fg = Math.round(k * 0.27 / 9);
  const cg = Math.max(0, Math.round((k - pg * 4 - fg * 9) / 4));
  const water = Math.round(w * 35 / 250) * 250;
  return { bmr: Math.round(bmr), tdee: Math.round(tdee), k, p: pg, c: cg, f: fg, water: Math.max(1500, water), floored };
};

/* ---------- streak ---------- */
NX.streak = () => {
  const has = k => { const d = S.days[k]; return d && (NX.dayTotals(d).n > 0 || (d.workouts || []).length); };
  let k = today(), n = 0;
  if (!has(k)) k = addDays(k, -1);
  while (has(k) && n < 3650) { n++; k = addDays(k, -1); }
  return n;
};

const VIEWS = NX.VIEWS = {};
function migrate() {
  const m = S.main;
  if (!m.prices) m.prices = {};

  // anciens identifiants d'aliments (base renumérotée)
  if (m.recent && m.recent.some(r => /^db\d+$/.test(r.fid))) m.recent = m.recent.filter(r => !/^db\d+$/.test(r.fid));
  if (m.fav && m.fav.some(id => /^db\d+$/.test(id))) m.fav = m.fav.filter(id => !/^db\d+$/.test(id));

NX.topRight = () => '<div class="tb-r"><span data-sync>' + NX.syncHtml() + '</span><button class="icon-btn plain" data-a="tab" data-tab="more" aria-label="Profil et réglages">' + ico('gear') + '</button></div>';

async function lookupOFF(code) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 9000);
  try {
    const r = await fetch('https://world.openfoodfacts.org/api/v2/product/' + encodeURIComponent(code) + '.json?fields=product_name,product_name_fr,generic_name_fr,brands,nutriments,serving_quantity', { signal: ctl.signal });
    if (r.status === 404) return null;
    if (!r.ok) throw new Error('http ' + r.status);
    const j = await r.json();
    if (!j || j.status !== 1 || !j.product) return null;
    const pr = j.product, n = pr.nutriments || {};
    const g = key => { const v = n[key]; return (v === '' || v == null || !isFinite(+v)) ? null : +v; };
    let k = g('energy-kcal_100g');
    if (k == null && g('energy_100g') != null) k = g('energy_100g') / 4.184;
    const per = { k, p: g('proteins_100g'), c: g('carbohydrates_100g'), f: g('fat_100g') };
    let name = String(pr.product_name_fr || pr.product_name || pr.generic_name_fr || '').trim();
    if (name) name = name.charAt(0).toUpperCase() + name.slice(1);
    const brand = String(pr.brands || '').split(',')[0].trim();
    const sq = +pr.serving_quantity;
    const r1 = v => v == null ? '' : Math.round(v * 10) / 10;
    const complete = !!name && per.k != null && per.p != null && per.c != null && per.f != null;
    return {
      name, brand, complete,
      per: complete ? { k: Math.round(per.k), p: r1(per.p), c: r1(per.c), f: r1(per.f) } : null,
      perRaw: { k: per.k == null ? '' : Math.round(per.k), p: r1(per.p), c: r1(per.c), f: r1(per.f) },
      unit: sq > 0 && sq < 2000 ? ['portion', Math.round(sq)] : null
    };
  } finally { clearTimeout(t); }
}

async function decodeBarcode(file) {
  const Z = window.ZXing;
  if (!Z) return null;
  const img = await loadImage(file);
  const hints = new Map();
  hints.set(Z.DecodeHintType.TRY_HARDER, true);
  hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.UPC_E, Z.BarcodeFormat.CODE_128]);
  const reader = new Z.MultiFormatReader(); reader.setHints(hints);
  for (const size of [1400, 900, 2000]) for (const rot of [0, 90]) {
    try {
      const c = drawScaled(img, size, rot);
      const src = new Z.HTMLCanvasElementLuminanceSource(c);
      const res = reader.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(src)));
      if (res && res.getText()) return res.getText();
    } catch (e) { /* essai suivant */ }
  }
  return null;
}
function loadImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => { res(im); setTimeout(() => URL.revokeObjectURL(url), 1000); };
    im.onerror = rej; im.src = url;
  });
}
function drawScaled(img, max, rot) {
  const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.round(img.naturalWidth * s), h = Math.round(img.naturalHeight * s);
  const c = document.createElement('canvas');
  c.width = rot ? h : w; c.height = rot ? w : h;
  const x = c.getContext('2d', { willReadFrequently: true });
  if (rot) { x.translate(h / 2, w / 2); x.rotate(rot * Math.PI / 180); x.drawImage(img, -w / 2, -h / 2, w, h); }
  else x.drawImage(img, 0, 0, w, h);
  return c;
}

let REST = null, restT = null, audioCtx = null;

    [0, .22, .44].forEach((t, i) => { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.frequency.value = i === 2 ? 1175 : 880; g.gain.setValueAtTime(.0001, audioCtx.currentTime + t); g.gain.exponentialRampToValueAtTime(.25, audioCtx.currentTime + t + .02); g.gain.exponentialRampToValueAtTime(.0001, audioCtx.currentTime + t + .18); o.connect(g).connect(audioCtx.destination); o.start(audioCtx.currentTime + t); o.stop(audioCtx.currentTime + t + .2); });

    if (r && r.items.length) {
      const w = r.weight || NX.recipeTotals(r).g || 1;
      return r.items.flatMap(it => expand(NX.foodById(it.fid) || NX.foodByName(it.name), it.g * g / w, it.name));
    }
  }
  return [{ food: f, g, name: f ? dispName(f) : name }];
}
function baseCost(f, g) {
  if (!f) return null;
  const p = NX.priceOf(f);
  if (p) return g / 1000 * p.kg;
  if (f.raw) { const rf = NX.foodByName(f.raw[0]), rp = rf && NX.priceOf(rf); if (rp) return g * f.raw[1] / 1000 * rp.kg; }
  return null;
}
NX.costOf = (f, g) => {
  if (!f) return null;
  let t = 0;
  for (const x of expand(f, g, '')) { const c = baseCost(x.food, x.g); if (c == null) return null; t += c; }
  return t;
};
const priceForKey = (key, f) => f ? NX.priceOf(f) : (S.main.prices[key] && S.main.prices[key].kg > 0 ? S.main.prices[key] : null);

/* ---------- journée type ---------- */
function itemFrom(f, g) { return { id: uid(), fid: f.id, name: dispName(f), g, per: clone(f.per), unit: f.unit ? clone(f.unit) : null, cat: f.cat }; }
const foodOf = it => NX.foodById(it.fid) || null;
const perOf = it => (foodOf(it) || it).per;
function basket() {
  if (!S.main.basket) {
    // panier de départ proposé selon les objectifs ; enregistré seulement quand l'utilisateur le modifie
    const items = STARTER.map(([n, g]) => { const f = NX.foodByName(n); return f ? itemFrom(f, g) : null; }).filter(Boolean);
    S.main.basket = { mode: 'plan', days: 7, items, seeded: true };
    adjust(false);
  }
  return S.main.basket;
}
function roundG(g, unit) {
  if (unit && unit[1] >= 30) return Math.max(unit[1], Math.round(g / unit[1]) * unit[1]);
  return Math.max(5, Math.round(g / 5) * 5);
}
function planTotals() {
  const t = { k: 0, p: 0, c: 0, f: 0, cost: 0, unknown: 0 };
  for (const it of S.main.basket.items) {
    const m = NX.macrosOf(perOf(it), it.g); t.k += m.k; t.p += m.p; t.c += m.c; t.f += m.f;
    const c = NX.costOf(foodOf(it), it.g); if (c == null) t.unknown++; else t.cost += c;
  }
  return t;
}
function adjust(toast) {
  const B = S.main.basket, g = S.main.goals;
  const rows = B.items.map(it => ({ it, per: perOf(it), cat: (foodOf(it) || it).cat }));
  let fK = 0, fP = 0, Kp = 0, Pp = 0, Ke = 0, Pe = 0;
  for (const r of rows) {
    const m = NX.macrosOf(r.per, r.it.g);
    if (FIXED.includes(r.cat) || !(r.per.k > 0)) { fK += m.k; fP += m.p; continue; }
    r.grp = r.per.p * 4 / r.per.k >= 0.33 ? 'p' : 'e';
    if (r.grp === 'p') { Kp += m.k; Pp += m.p; } else { Ke += m.k; Pe += m.p; }
  }
  const K = Math.max(0, g.k - fK), P = Math.max(0, g.p - fP);
  let a = NaN, b = NaN;
  const det = Kp * Pe - Ke * Pp;
  if (Kp > 0 && Ke > 0 && Math.abs(det) > 1e-6) { a = (K * Pe - Ke * P) / det; b = (Kp * P - K * Pp) / det; }
  if (!(a > 0) || !(b > 0)) { const s = (Kp + Ke) > 0 ? K / (Kp + Ke) : 1; a = b = s; }
  a = NX.clamp(a, 0.25, 4); b = NX.clamp(b, 0.25, 4);
  for (const r of rows) if (r.grp) r.it.g = roundG(r.it.g * (r.grp === 'p' ? a : b), r.it.unit || (foodOf(r.it) || {}).unit);
  if (toast) { const t = planTotals(); NX.toast('Ajusté : ' + fmt(t.k) + ' kcal et ' + fmt(t.p) + ' g de protéines par jour'); }
}

/* ---------- d'après le journal ---------- */
function journalData() {
  const keys = [];
  let k = today();
  for (let i = 0; i < 60 && keys.length < 14; i++, k = addDays(k, -1)) { const d = S.days[k]; if (d && NX.dayTotals(d).n) keys.push(k); }
  const map = {};
  for (const key of keys) for (const [mk] of NX.MEALS) for (const e of (S.days[key].meals[mk] || [])) {
    const f = (e.fid && NX.foodById(e.fid)) || NX.foodByName(e.name);
    const id = f ? f.id : 'n:' + norm(e.name);
    const row = map[id] || (map[id] = { id, food: f, name: f ? dispName(f) : e.name, g: 0 });
    row.g += e.g;
  }
  const n = keys.length;
  return { n, lines: Object.values(map).map(r => Object.assign(r, { g: r.g / Math.max(1, n) })) };
}

/* ---------- ce qu'il faut acheter ---------- */
function needLines() {
  const B = basket();
  if (B.mode === 'plan') return B.items.map(it => ({ food: foodOf(it), g: it.g, name: it.name }));
  return journalData().lines;
}
function buyList(lines, days) {
  const map = {};
  for (const l of lines) for (const x of expand(l.food, l.g * days, l.name)) {
    let f = x.food, g = x.g;
    if (f && f.raw) { const rf = NX.foodByName(f.raw[0]); if (rf) { g *= f.raw[1]; f = rf; } }
    const id = f ? f.id : 'n:' + norm(x.name);
    const row = map[id] || (map[id] = { id, food: f, name: f ? dispName(f) : x.name, g: 0 });
    row.g += g;
  }
  return Object.values(map).filter(r => r.g > 0.5).map(r => {
    const p = priceForKey(r.id, r.food);
    let n = 0, cost = null, exact = null;
    if (p) {
      exact = r.g / 1000 * p.kg;
      if (p.pack > 0) { n = Math.max(1, Math.ceil(r.g / p.pack - 0.05)); cost = n * p.pack / 1000 * p.kg; } else cost = exact;
    }
    return Object.assign(r, { p, n, cost, exact });
  }).sort((a, b) => (b.cost || 0) - (a.cost || 0));
}
function qtyLabel(r) {
  const f = r.food, liq = isLiquid(f), u = f && f.unit;
  if (r.p && r.p.pack > 0) {
    const per = countable(u) ? r.p.pack / u[1] : 0;
    if (per > 0.95 && per < 1.05) return r.n + ' ' + plural(u[0], r.n);
    if (per >= 2 && Math.abs(per - Math.round(per)) < 0.05) return r.n + ' × ' + Math.round(per) + ' ' + plural(u[0], Math.round(per));
    return r.n + ' × ' + wLabel(r.p.pack, liq);
  }
  if (countable(u) && u[1] >= 30) { const c = Math.max(1, Math.ceil(r.g / u[1] - 0.05)); return c + ' ' + plural(u[0], c); }
  return wLabel(Math.ceil(r.g / 10) * 10, liq);
}

function receipt(list, days) {

  return Object.keys(byDay).sort().map(k => ({ x: NX.daysBetween(start, k), y: byDay[k] })).filter(p => p.x >= 0 && p.x < n);
}
function lastMeasure(m) { const ks = Object.keys(S.days).filter(k => S.days[k].measures && S.days[k].measures[m]).sort(); return ks.length ? S.days[ks[ks.length - 1]].measures[m] : null; }
function firstMeasure(m) { const ks = Object.keys(S.days).filter(k => S.days[k].measures && S.days[k].measures[m]).sort(); return ks.length ? S.days[ks[0]].measures[m] : null; }

const Store = () => NX.Store;
A['set-glass'] = () => NX.openSheet({ id: 'glass', title: 'Taille du verre', render: () => ({ body: '<div class="chips" style="flex-wrap:wrap">' + [150, 200, 250, 330, 500, 750].map(v => '<button class="chip' + (S.main.settings.glass === v ? ' on' : '') + '" data-a="glass-set" data-v="' + v + '">' + v + ' ml</button>').join('') + '</div><p class="note">Chaque appui sur « + » dans la carte Eau ajoutera cette quantité.</p>' }) });
A['glass-set'] = el => { S.main.settings.glass = +el.dataset.v; NX.touchMain(); NX.closeSheet('glass'); NX.render(); };
A.reminders = () => NX.openSheet({ id: 'rem', title: 'Rappels', render: () => ({ body: '<div class="callout">Les applis web ne peuvent pas envoyer de notifications de façon fiable sur iPhone. Le plus simple : crée des rappels qui se répètent dans l\'appli <b>Rappels</b> de ton téléphone.</div><p class="note">Par exemple : « Pesée » tous les matins à 8 h, « Boire de l\'eau » toutes les 2 heures, « Collation » à 16 h.</p><p class="note">Dans Nexafit, la carte du journal te montre d\'un coup d\'œil ce qui manque aujourd\'hui : pesée, eau et sommeil.</p>' }) });
A.about = () => NX.openSheet({ id: 'about', full: true, title: 'À propos de Nexafit', render: () => ({ body:
  '<div class="sec"><div class="label">Tes données</div><p class="note">Tout reste sur ton téléphone : pas de compte, pas de serveur, personne d\'autre ne peut voir tes données. Exporte une sauvegarde de temps en temps (Réglages › Sauvegarde et export) : si tu supprimes l\'appli ou changes de téléphone, c\'est elle qui te permettra de tout récupérer.</p></div>'
  + '<div class="sec"><div class="label">Les valeurs nutritionnelles</div><p class="note">La base intégrée contient ' + (window.NX_FOODS || []).length + ' aliments courants et produits de marque, avec des valeurs moyennes proches de la table Ciqual et des prix moyens indicatifs, modifiables dans Courses. Quand tu scannes un produit, Nexafit cherche ses valeurs dans <b>Open Food Facts</b>, une base alimentaire libre et collaborative (licence ODbL). Le produit est ensuite gardé sur ton téléphone et reconnu instantanément.</p></div>'
  + '<div class="sec"><div class="label">Les calculs</div><p class="note">Besoins : formule de Mifflin-St Jeor × niveau d\'activité, puis surplus ou déficit selon l\'objectif. Protéines : 2 g par kg en prise de masse. Lipides : environ 27 % des calories. Glucides : le reste. Force : 1RM estimé avec la formule d\'Epley.</p></div>'

A.backup = () => NX.openSheet({ id: 'backup', title: 'Sauvegarde et export', render: () => {
  const nDays = Object.keys(S.days).length, last = S.main.lastExport;
  return { body: '<div class="callout"><b>Tes données sont enregistrées sur ce téléphone.</b> Exporte une sauvegarde de temps en temps et garde-la dans Fichiers ou iCloud Drive : elle te permet de tout récupérer si tu changes de téléphone. ' + (last ? 'Dernière sauvegarde le ' + new Date(last).toLocaleDateString(NX.LOC()) + '.' : 'Aucune sauvegarde pour l\'instant.') + ' ' + nDays + ' jour' + (nDays > 1 ? 's' : '') + ' enregistré' + (nDays > 1 ? 's' : '') + '.</div>'
    + '<div class="list">'
    + '<button class="li" data-a="export-json"><span class="lic">' + ico('download') + '</span><span class="lt"><b>Exporter une sauvegarde complète</b><span>Fichier .json à garder dans Fichiers ou iCloud</span></span></button>'
    + '<button class="li" data-a="export-csv"><span class="lic">' + ico('list') + '</span><span class="lt"><b>Exporter le journal en tableau</b><span>Fichier .csv lisible dans Excel ou Numbers</span></span></button>'
    + '<button class="li" data-a="import"><span class="lic">' + ico('upload') + '</span><span class="lt"><b>Importer une sauvegarde</b><span>Remplace les données actuelles</span></span></button>'
    + '</div>' };
} });
function exportData() { return JSON.stringify({ app: 'Nexafit', version: 1, exportedAt: new Date().toISOString(), main: S.main, days: S.days }); }
async function offer(filename, data, type) {
  const blob = new Blob([data], { type });
  const done = () => {
    if (/\.json$/.test(filename)) { S.main.lastExport = Date.now(); NX.touchMain(); NX.render(); NX.refreshSheet('backup'); }
    NX.toast('Fichier prêt : ' + filename);
  };
  try {
    const file = new File([blob], filename, { type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); done(); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  try {
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = filename; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    done();
  } catch (e) { NX.toast('Export impossible sur ce navigateur'); }
}
A['export-json'] = () => offer('nexafit-sauvegarde-' + today() + '.json', exportData(), 'application/json');
A['export-csv'] = () => {
  const rows = [['date', 'kcal', 'proteines_g', 'glucides_g', 'lipides_g', 'eau_ml', 'sommeil_h', 'poids_kg', 'seances']];
  Object.keys(S.days).sort().forEach(k => { const d = S.days[k], t = NX.dayTotals(d); rows.push([k, Math.round(t.k), Math.round(t.p), Math.round(t.c), Math.round(t.f), d.water || '', d.sleep || '', d.weight || '', (d.workouts || []).length]); });
  offer('nexafit-journal-' + today() + '.csv', '﻿' + rows.map(r => r.join(';')).join('\n'), 'text/csv');
};
A.import = () => { const i = $('#file-import'); i.value = ''; i.click(); };
$('#file-import').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  let data;
  try { data = JSON.parse(await f.text()); } catch (err) { return NX.toast('Fichier illisible'); }
  if (!data || !data.main || !data.days) return NX.toast('Ce fichier n\'est pas une sauvegarde Nexafit');
  NX.openSheet({ id: 'import-ok', title: 'Importer cette sauvegarde ?', render: () => ({ body: '<p class="note">Sauvegarde du ' + esc(data.exportedAt ? new Date(data.exportedAt).toLocaleDateString(NX.LOC()) : '?') + ' avec ' + Object.keys(data.days).length + ' jours. Elle remplacera les données actuelles de Nexafit.</p>', foot: '<button class="btn ghost" data-a="sheet-close">Annuler</button><button class="btn" data-a="import-go">Importer</button>' }) });
  A['import-go'] = () => {
    const now = Date.now();
    const oldDays = Object.keys(S.days);
    S.main = Object.assign(S.main, data.main, { updatedAt: now });
    S.days = data.days;
    Object.values(S.days).forEach(d => d.updatedAt = now);
    NX.save('main');
    Object.keys(S.days).forEach(k => NX.save('d-' + k));
    oldDays.filter(k => !S.days[k]).forEach(k => NX.save('d-' + k));
    NX.closeSheet('import-ok'); NX.closeSheet('backup', true);
    UI.tab = 'journal'; UI.date = today(); NX.render(); NX.toast('Sauvegarde importée');
  };
});

NX.boot();
})();
