<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nexafit</title>
<meta name="description" content="Suivi de prise de masse : repas, macros, eau, sommeil, poids et musculation.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nexafit">
<meta name="theme-color" content="#EDF0F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1217" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Instrument+Sans:wght@400..700&display=swap">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 25; }
img { max-width: 100%; }
[hidden] { display: none !important; }
.sheet { padding-top: calc(env(safe-area-inset-top, 0px) + 8px); }

/* Layout : une colonne façon appli iPhone, barre d'onglets en bas, feuilles qui montent du bas.
   Couleurs des macros = couleurs des disques olympiques (25 rouge, 20 bleu, 15 jaune). */
:root {
  --bg: #EDF0F3;
  --surface: #FFFFFF;
  --surface-2: #F5F7F9;
  --ink: #12161C;
  --muted: #5D6571;
  --faint: #8A929E;
  --line: #DADFE6;
  --brand: #D52E35;
  --brand-ink: #FFFFFF;
  --prot: #D52E35;
  --carb: #1F5BD6;
  --fat: #DCA50A;
  --water: #1497C2;
  --sleep: #6B5BD6;
  --good: #1E8B4E;
  --warn: #C2700A;
  --steel: #2A313B;
  --shadow: 0 1px 2px rgba(18,22,28,.06), 0 8px 24px rgba(18,22,28,.07);
  --scrim: rgba(12,15,20,.42);
  --f-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 16px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1217; --surface: #171B22; --surface-2: #1D222A; --ink: #ECEFF3; --muted: #9AA3AF; --faint: #6F7884;
  --line: #272D36; --brand: #F0474E; --brand-ink: #FFFFFF; --prot: #F0474E; --carb: #5089FF; --fat: #F0C236;
  --water: #3BC2EA; --sleep: #9A8CFF; --good: #3DBB74; --warn: #F0A23A; --steel: #C9D0D9;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.35); --scrim: rgba(0,0,0,.6); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0F1217; --surface: #171B22; --surface-2: #1D222A; --ink: #ECEFF3; --muted: #9AA3AF; --faint: #6F7884;
  --line: #272D36; --brand: #F0474E; --brand-ink: #FFFFFF; --prot: #F0474E; --carb: #5089FF; --fat: #F0C236;
  --water: #3BC2EA; --sleep: #9A8CFF; --good: #3DBB74; --warn: #F0A23A; --steel: #C9D0D9;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.35); --scrim: rgba(0,0,0,.6); color-scheme: dark; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); color: var(--ink); }
body {
  font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px));
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2.5px solid var(--carb); outline-offset: 2px; border-radius: 8px; }
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; padding-top: 14px; }
.num { font-family: var(--f-display); font-variant-numeric: tabular-nums; }
.ico { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ico.sm { width: 18px; height: 18px; }
.ico.fill { fill: currentColor; stroke: none; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.label { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; font-weight: 650; color: var(--muted); }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.h-view { font-family: var(--f-display); font-stretch: 118%; font-weight: 850; font-size: 30px; letter-spacing: -.01em; line-height: 1.05; }
.h-sec { font-family: var(--f-display); font-stretch: 108%; font-weight: 750; font-size: 18px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.sec { display: flex; flex-direction: column; gap: 10px; }

/* En-tête */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-stretch: 125%; font-weight: 900; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; }
.brand-mark { width: 26px; height: 26px; border-radius: 50%; background: var(--brand); display: grid; place-items: center; box-shadow: inset 0 0 0 4px color-mix(in srgb, var(--brand) 70%, #000 30%); }
.brand-mark::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--bg); }
.sync { font-size: 12px; color: var(--faint); display: flex; align-items: center; gap: 6px; }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); display: block; }
.sync.local i { background: var(--warn); }
.sync.busy i { background: var(--carb); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.daynav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.daynav .title { display: flex; flex-direction: column; }
.daynav .sub { font-size: 13px; color: var(--muted); }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--ink); background: var(--surface); box-shadow: var(--shadow); }
.icon-btn:disabled { opacity: .35; }
.icon-btn.plain { background: transparent; box-shadow: none; }
.streak { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 650; color: var(--brand); }

/* Résumé du jour */
.summary { background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); padding: 18px; display: flex; flex-direction: column; gap: 16px; }
.sum-top { display: grid; grid-template-columns: 132px 1fr; gap: 16px; align-items: center; }
.ring { position: relative; width: 132px; height: 132px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .trk { stroke: var(--surface-2); }
.ring .val { stroke: var(--steel); transition: stroke-dashoffset .7s cubic-bezier(.2,.8,.2,1); }
.ring.over .val { stroke: var(--warn); }
.ring-c { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; align-content: center; }
.ring-c b { font-family: var(--f-display); font-stretch: 112%; font-weight: 850; font-size: 30px; line-height: 1; }
.ring-c span { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
.kstats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
.kstat { display: flex; flex-direction: column; min-width: 0; }
.kstat b { font-family: var(--f-display); font-weight: 750; font-size: 19px; font-variant-numeric: tabular-nums; }
.kstat span { font-size: 12px; color: var(--muted); }
.macros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.macro { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.macro .mh { display: flex; justify-content: space-between; align-items: baseline; gap: 4px; font-size: 12.5px; }
.macro .mh b { font-family: var(--f-display); font-weight: 750; font-size: 15px; font-variant-numeric: tabular-nums; }
.bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: var(--c, var(--brand)); transition: width .6s cubic-bezier(.2,.8,.2,1); }
.plate-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); display: inline-block; margin-right: 5px; box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--c) 60%, #000 40%); }

/* Barre olympique */
.barbell { width: 100%; height: 56px; display: block; }

/* Check-in du jour */
.checkins { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.chk { background: var(--surface); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 8px; text-align: left; box-shadow: var(--shadow); min-width: 0; }
.chk .ct { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); font-weight: 600; }
.chk .ct .ico { width: 16px; height: 16px; color: var(--c); }
.chk b { font-family: var(--f-display); font-weight: 800; font-size: 20px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.chk b small { font-size: 12px; font-weight: 600; color: var(--muted); font-family: var(--f-body); }
.chk.todo b { color: var(--faint); }
.glasses { display: flex; gap: 2px; flex-wrap: wrap; }
.glasses i { width: 7px; height: 12px; border-radius: 2px 2px 3px 3px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); }
.glasses i.on { background: var(--water); box-shadow: none; }

/* Repas */
.meal { display: flex; flex-direction: column; }
.meal-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 0; }
.meal-h .mt { display: flex; flex-direction: column; min-width: 0; }
.meal-h .mk { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.add-btn { display: inline-flex; align-items: center; gap: 4px; height: 34px; padding: 0 12px 0 8px; border-radius: 99px; background: color-mix(in srgb, var(--brand) 11%, transparent); color: var(--brand); font-weight: 650; font-size: 13.5px; }
.add-btn .ico { width: 18px; height: 18px; stroke-width: 2.2; }
.items { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 11px 14px; width: 100%; text-align: left; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.item:active { background: var(--surface-2); }
.item .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.item .ds { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.item .kc { font-family: var(--f-display); font-weight: 750; font-variant-numeric: tabular-nums; text-align: right; }
.item .kc small { display: block; font-family: var(--f-body); font-weight: 500; font-size: 11.5px; color: var(--faint); }
.item > div { min-width: 0; }
.empty-meal { font-size: 13.5px; color: var(--faint); padding: 2px 0 6px; }
.row-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* Boutons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 20px; border-radius: 14px; background: var(--brand); color: var(--brand-ink); font-weight: 700; font-size: 15.5px; }
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .45; }
.btn.block { width: 100%; }
.btn.ghost { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.btn.soft { background: var(--surface-2); color: var(--ink); }
.btn.danger { background: transparent; color: var(--brand); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--brand) 40%, transparent); }
.btn.sm { height: 38px; padding: 0 14px; font-size: 14px; border-radius: 11px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 13px; border-radius: 99px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); font-size: 13.5px; font-weight: 600; white-space: nowrap; }
.chip.on { background: var(--ink); color: var(--bg); box-shadow: none; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.seg { display: flex; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { flex: 1; height: 34px; border-radius: 9px; font-size: 13.5px; font-weight: 650; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

/* Champs */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.inp { height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); padding: 0 13px; width: 100%; min-width: 0; font-size: 16px; }
.inp:focus { border-color: var(--carb); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--carb) 18%, transparent); }
textarea.inp { height: auto; min-height: 92px; padding: 11px 13px; resize: vertical; line-height: 1.45; }
select.inp { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.search { position: relative; }
.search .ico { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--faint); }
.search .inp { padding-left: 42px; }
.stepper { display: flex; align-items: center; gap: 10px; }
.stepper button { width: 46px; height: 46px; border-radius: 12px; background: var(--surface-2); font-size: 22px; font-weight: 600; display: grid; place-items: center; }
.stepper .inp { text-align: center; font-family: var(--f-display); font-weight: 750; font-size: 20px; }

/* Listes génériques */
.list { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.li { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-top: 1px solid var(--line); width: 100%; text-align: left; min-height: 54px; }
.li:first-child { border-top: 0; }
.li:active { background: var(--surface-2); }
.li .lt { flex: 1; min-width: 0; }
.li .lt b { display: block; font-weight: 620; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .lt span { display: block; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .rt { font-family: var(--f-display); font-weight: 750; font-variant-numeric: tabular-nums; flex: none; text-align: right; }
.li .lic { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); color: var(--ink); flex: none; }
.li .chev { color: var(--faint); }
.group-label { padding: 14px 2px 6px; }
.note { font-size: 13px; color: var(--muted); line-height: 1.5; }
.callout { background: var(--surface-2); border-radius: 14px; padding: 12px 14px; font-size: 13.5px; color: var(--muted); line-height: 1.5; }
.callout b { color: var(--ink); }
.tag { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 6px; font-size: 11px; font-weight: 700; letter-spacing: .03em; background: var(--surface-2); color: var(--muted); }
.tag.pr { background: color-mix(in srgb, var(--fat) 22%, transparent); color: color-mix(in srgb, var(--fat) 55%, var(--ink)); }
.tag.ai { background: color-mix(in srgb, var(--sleep) 16%, transparent); color: var(--sleep); }

/* Onglets */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4); border-top: 1px solid var(--line);
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-bottom: max(8px, env(safe-area-inset-bottom, 0px)); padding-top: 6px; }
.tabs-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10.5px; font-weight: 650; color: var(--faint); padding: 4px 0; letter-spacing: .02em; }
.tab.on { color: var(--ink); }
.tab .ico { width: 24px; height: 24px; }
.fab { justify-self: center; width: 56px; height: 56px; border-radius: 50%; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; margin-top: -22px; box-shadow: 0 6px 18px color-mix(in srgb, var(--brand) 45%, transparent), inset 0 0 0 5px color-mix(in srgb, var(--brand) 78%, #000 22%); }
.fab .ico { width: 26px; height: 26px; stroke-width: 2.4; }
.fab:active { transform: scale(.94); }

/* Feuilles (bottom sheets) */
.sheet { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; justify-content: flex-end; }
.sheet .scrim { position: absolute; inset: 0; background: var(--scrim); animation: fade .2s ease; }
.sheet .panel { position: relative; background: var(--bg); border-radius: 22px 22px 0 0; max-height: 94%; display: flex; flex-direction: column; animation: up .28s cubic-bezier(.2,.8,.2,1); width: 100%; max-width: 600px; margin: 0 auto;
  padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet.full .panel { height: 94%; }
.panel-h { display: flex; align-items: center; gap: 10px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
.panel-h::before { content: ""; position: absolute; top: 7px; left: 50%; width: 38px; height: 5px; margin-left: -19px; border-radius: 9px; background: var(--line); }
.panel-h h2 { flex: 1; font-family: var(--f-display); font-stretch: 112%; font-weight: 800; font-size: 20px; padding-top: 12px; min-width: 0; }
.panel-h .icon-btn { margin-top: 10px; }
.panel-b { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 6px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 16px; flex: 1; overscroll-behavior: contain; }
.panel-f { padding: 10px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); border-top: 1px solid var(--line); background: var(--bg); display: flex; gap: 10px; }
.panel-f .btn { flex: 1; }
@keyframes up { from { transform: translateY(100%); } }
@keyframes fade { from { opacity: 0; } }
.sheet.closing .panel { transform: translateY(100%); transition: transform .2s ease-in; }
.sheet.closing .scrim { opacity: 0; transition: opacity .2s; }

/* Toast */
.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); z-index: 80; background: var(--ink); color: var(--bg); padding: 11px 16px; border-radius: 14px; font-weight: 600; font-size: 14px; opacity: 0; pointer-events: none; transition: .25s; max-width: calc(100% - 32px); display: flex; align-items: center; gap: 10px; box-shadow: var(--shadow); }
.toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast button { color: var(--fat); font-weight: 700; }

/* Chrono de repos */
.timer { position: fixed; z-index: 40; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); width: min(528px, calc(100% - 32px)); background: var(--steel); color: var(--bg); border-radius: 18px; padding: 10px 10px 10px 16px; display: flex; align-items: center; gap: 10px; box-shadow: var(--shadow); overflow: hidden; }
.timer .tprog { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--brand); transition: width 1s linear; }
.timer b { font-family: var(--f-display); font-weight: 850; font-size: 24px; font-variant-numeric: tabular-nums; min-width: 64px; }
.timer .tl { flex: 1; font-size: 12.5px; opacity: .75; min-width: 0; }
.timer button { height: 36px; min-width: 44px; padding: 0 10px; border-radius: 10px; background: color-mix(in srgb, var(--bg) 14%, transparent); color: var(--bg); font-weight: 700; font-size: 13px; }
.timer.done { background: var(--good); }

/* Muscu */
.session-h { background: var(--steel); color: var(--bg); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.session-h .h-sec { color: var(--bg); }
.session-h .ss { display: flex; gap: 18px; font-size: 12.5px; opacity: .8; flex-wrap: wrap; }
.session-h .ss b { font-family: var(--f-display); font-size: 17px; display: block; opacity: 1; font-variant-numeric: tabular-nums; }
.exo { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.exo-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.exo-h b { font-family: var(--f-display); font-stretch: 105%; font-weight: 750; font-size: 16.5px; }
.exo-h .prev { font-size: 12.5px; color: var(--muted); margin-top: 2px; }

/* ---------- aliments ---------- */
let FOOD_CACHE = null, FOOD_SIG = '';
NX.allFoods = () => {
  const sig = S.main.foods.length + ':' + S.main.recipes.length + ':' + S.main.updatedAt;
  if (FOOD_CACHE && sig === FOOD_SIG) return FOOD_CACHE;
  const out = [];
  for (const f of S.main.recipes) {
    const t = NX.recipeTotals(f);
    const w = f.weight || t.g || 1;
    out.push({ id: f.id, kind: 'recipe', name: f.name, cat: 'Mes recettes', per: { k: t.k / w * 100, p: t.p / w * 100, c: t.c / w * 100, f: t.f / w * 100 }, unit: ['portion', w / Math.max(1, f.servings || 1)] });
  }
  for (const f of S.main.foods) out.push({ id: f.id, kind: 'mine', name: f.name, brand: f.brand, cat: 'Mes aliments', per: f.per, unit: f.unit && f.unit[1] ? f.unit : null, ai: f.ai, src: f.src });
  (window.NX_FOODS || []).forEach((r, i) => out.push({ id: 'db' + i, kind: 'db', name: r[0], cat: r[1], per: { k: r[2], p: r[3], c: r[4], f: r[5] }, unit: r[7] ? [r[6], r[7]] : null }));
  out.forEach(f => f._n = norm(f.name + ' ' + (f.brand || '')));
  FOOD_CACHE = out; FOOD_SIG = sig;
  return out;
};
NX.foodById = id => NX.allFoods().find(f => f.id === id) || null;
NX.searchFoods = q => {
  const words = norm(q).split(/\s+/).filter(Boolean);
  if (!words.length) return [];
  const res = [];
  for (const f of NX.allFoods()) {
    if (!words.every(w => f._n.includes(w))) continue;
    let s = 0;
    if (f._n.startsWith(words[0])) s += 3;
    else if (new RegExp('(^|[\\s\'-])' + words[0].replace(/[.*+?^${}()|[\]\\]/g, '')).test(f._n)) s += 1;
    if (f.cat === 'Féculents' || f.cat === 'Viandes & poissons' || f.cat === 'Œufs & laitiers') s += 0.6;
    if (f.kind !== 'db') s += 2;
    if (S.main.fav.includes(f.id)) s += 2;
    if (S.main.recent.some(r => r.fid === f.id)) s += 1;
    s -= f.name.length / 60;
    res.push([s, f]);
  }
  return res.sort((a, b) => b[0] - a[0]).slice(0, 50).map(x => x[1]);
};
NX.macrosOf = (per, g) => ({ k: per.k * g / 100, p: per.p * g / 100, c: per.c * g / 100, f: per.f * g / 100 });
NX.entryTotals = e => NX.macrosOf(e.per, e.g);
NX.dayTotals = day => {
  const t = { k: 0, p: 0, c: 0, f: 0, n: 0 };
  if (!day || !day.meals) return t;
  for (const m of MEALS) for (const e of (day.meals[m[0]] || [])) { const x = NX.entryTotals(e); t.k += x.k; t.p += x.p; t.c += x.c; t.f += x.f; t.n++; }
  return t;
};
NX.mealTotals = list => list.reduce((t, e) => { const x = NX.entryTotals(e); t.k += x.k; t.p += x.p; t.c += x.c; t.f += x.f; return t; }, { k: 0, p: 0, c: 0, f: 0 });
NX.recipeTotals = r => (r.items || []).reduce((t, it) => { const x = NX.macrosOf(it.per, it.g); t.k += x.k; t.p += x.p; t.c += x.c; t.f += x.f; t.g += it.g; return t; }, { k: 0, p: 0, c: 0, f: 0, g: 0 });
NX.gramsLabel = (g, unit) => {
  if (unit && unit[1]) {
    const q = g / unit[1];
    if (Math.abs(q - Math.round(q * 2) / 2) < 0.01 && q > 0 && q <= 20) {
      const qq = Math.round(q * 2) / 2;
      return fmt(qq, 1) + ' ' + unit[0] + (qq > 1 && !/s$|x$/.test(unit[0]) && !unit[0].includes(' ') ? 's' : '') + ' · ' + fmt(g) + ' g';
    }
  }
  return fmt(g) + ' g';
};
NX.defaultMeal = () => { const h = new Date().getHours() + new Date().getMinutes() / 60; return h < 10.5 ? 'b' : h < 14.5 ? 'l' : h < 18.5 ? 's' : 'd'; };
NX.pushRecent = (fid, g) => {
  if (!fid) return;
  S.main.recent = [{ fid, g }].concat(S.main.recent.filter(r => r.fid !== fid)).slice(0, 30);
};

/* ---------- exercices ---------- */
NX.allExercises = () => (window.NX_EXERCISES || []).map(e => ({ name: e[0], group: e[1] })).concat((S.main.exCustom || []).map(e => ({ name: e[0], group: e[1] || 'Perso', mine: true })));
NX.ensurePrograms = () => {
  if (S.main.programs) return;
  S.main.programs = (window.NX_PROGRAMS || []).map(p => ({ id: uid(), name: p[0], days: p[1].map(d => ({ id: uid(), name: d[0], items: d[1].map(it => ({ ex: it[0], sets: it[1], reps: it[2] })) })) }));
};
NX.e1rm = (w, r) => (w > 0 && r > 0) ? (r === 1 ? w : w * (1 + Math.min(r, 15) / 30)) : 0;
NX.allWorkouts = () => {
  const out = [];
  for (const k of Object.keys(S.days)) for (const w of (S.days[k].workouts || [])) out.push(Object.assign({ date: k }, w));
  return out.sort((a, b) => (b.start || 0) - (a.start || 0));
};
NX.bestFor = (ex, excludeId) => {
  let best = 0, bestSet = null;
  for (const w of NX.allWorkouts()) { if (w.id === excludeId) continue; for (const e of w.exercises) if (e.ex === ex) for (const s of e.sets) if (s.done) { const v = NX.e1rm(s.w, s.r); if (v > best) { best = v; bestSet = s; } } }
  return { best, set: bestSet };
};
NX.lastFor = (ex, excludeId) => {
  for (const w of NX.allWorkouts()) { if (w.id === excludeId) continue; const e = w.exercises.find(x => x.ex === ex && x.sets.some(s => s.done)); if (e) return { date: w.date, sets: e.sets.filter(s => s.done) }; }
  return null;
};

/* ---------- objectifs ---------- */
const ACTIVITY = [[1.2, 'Sédentaire', 'Bureau, peu de marche'], [1.375, 'Légèrement actif', '1 à 3 séances par semaine'], [1.55, 'Actif', '3 à 5 séances par semaine'], [1.725, 'Très actif', '6 séances ou travail physique'], [1.9, 'Extrêmement actif', 'Sport intense tous les jours']];
const GOALS = { lean: ['Prise de masse sèche', 250], bulk: ['Prise de masse', 450], keep: ['Maintien', 0], cut: ['Sèche', -400] };
NX.ACTIVITY = ACTIVITY; NX.GOALS = GOALS;
NX.calcGoals = p => {
  const w = num(p.weight), h = num(p.height), a = num(p.age);
  if (!w || !h || !a) return null;
  const bmr = 10 * w + 6.25 * h - 5 * a + (p.sex === 'f' ? -161 : 5);
  const tdee = bmr * num(p.activity || 1.55);
  const k = Math.round((tdee + (GOALS[p.goal] || GOALS.bulk)[1]) / 10) * 10;
  const pg = Math.round(w * (p.goal === 'cut' ? 2.2 : p.goal === 'keep' ? 1.8 : 2));
  const fg = Math.round(k * 0.27 / 9);
  const cg = Math.max(0, Math.round((k - pg * 4 - fg * 9) / 4));
  const water = Math.round(w * 35 / 250) * 250;
  return { bmr: Math.round(bmr), tdee: Math.round(tdee), k, p: pg, c: cg, f: fg, water: Math.max(1500, water) };
};

/* ---------- streak ---------- */
NX.streak = () => {
  const has = k => { const d = S.days[k]; return d && (NX.dayTotals(d).n > 0 || (d.workouts || []).length); };
  let k = today(), n = 0;
  if (!has(k)) k = addDays(k, -1);
  while (has(k) && n < 3650) { n++; k = addDays(k, -1); }
  return n;
};

/* ---------- feuilles ---------- */
const sheets = [];
NX.openSheet = (cfg) => {
  // cfg: {id, title, render():{body, foot}, full, onOpen, onClose, back}
  NX.closeSheet(cfg.id, true);
  const el = document.createElement('div');
  el.className = 'sheet' + (cfg.full ? ' full' : '');
  el.dataset.sheet = cfg.id;
  el.setAttribute('role', 'dialog');
  el.setAttribute('aria-modal', 'true');
  el.innerHTML = '<div class="scrim" data-a="sheet-close"></div><div class="panel"><div class="panel-h"><h2></h2><button class="icon-btn plain" data-a="sheet-close" aria-label="Fermer">' + ico('x') + '</button></div><div class="panel-b"></div><div class="panel-f" hidden></div></div>';
  $('#sheets').appendChild(el);
  const s = Object.assign({ el }, cfg);
  sheets.push(s);
  document.body.style.overflow = 'hidden';
  NX.refreshSheet(cfg.id);
  if (cfg.onOpen) cfg.onOpen(el);
  return s;
};
NX.refreshSheet = (id, keepScroll = true) => {
  const s = sheets.find(x => x.id === id);
  if (!s) return;
  const r = s.render();
  const b = $('.panel-b', s.el), f = $('.panel-f', s.el);
  const st = b.scrollTop;
  $('.panel-h h2', s.el).textContent = typeof s.title === 'function' ? s.title() : s.title;
  b.innerHTML = r.body || '';
  if (r.foot) { f.innerHTML = r.foot; f.hidden = false; } else { f.innerHTML = ''; f.hidden = true; }
  if (keepScroll) b.scrollTop = st;
};
NX.refreshSheets = () => sheets.forEach(s => NX.refreshSheet(s.id));
NX.closeSheet = (id, instant) => {
  const i = id ? sheets.findIndex(x => x.id === id) : sheets.length - 1;
  if (i < 0) return;
  const s = sheets[i];
  sheets.splice(i, 1);
  if (s.onClose) s.onClose();
  if (instant) s.el.remove();
  else { s.el.classList.add('closing'); setTimeout(() => s.el.remove(), 200); }
  if (!sheets.length) document.body.style.overflow = '';
};
NX.topSheet = () => sheets[sheets.length - 1] || null;
NX.hasSheet = id => sheets.some(s => s.id === id);
NX.sheetEl = id => { const s = sheets.find(x => x.id === id); return s ? s.el : null; };

/* ---------- toast ---------- */
let toastT;
NX.toast = (msg, action) => {
  const t = $('#toast');
  t.innerHTML = '<span>' + esc(msg) + '</span>' + (action ? '<button data-a="toast-act">' + esc(action.label) + '</button>' : '');
  NX._toastAct = action ? action.fn : null;
  t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('show'), action ? 5000 : 2400);
};

/* ---------- délégation d'événements ---------- */
const A = NX.A = {}, IN = NX.IN = {}, CH = NX.CH = {};
A['sheet-close'] = () => NX.closeSheet();
A['toast-act'] = () => { $('#toast').classList.remove('show'); if (NX._toastAct) NX._toastAct(); };
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el || el.disabled) return;
  const fn = A[el.dataset.a];
  if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('input', e => { const el = e.target.closest('[data-in]'); if (el && IN[el.dataset.in]) IN[el.dataset.in](el, e); });

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && sheets.length) NX.closeSheet();
  if (e.key === 'Enter' && e.target.matches('[data-enter]')) { const fn = A[e.target.dataset.enter]; if (fn) { e.preventDefault(); fn(e.target, e); } }
});

async function lookupOFF(code) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 9000);
  try {
    const r = await fetch('https://world.openfoodfacts.org/api/v2/product/' + encodeURIComponent(code) + '.json?fields=product_name,product_name_fr,generic_name_fr,brands,nutriments,serving_quantity', { signal: ctl.signal });
    if (r.status === 404) return null;
    if (!r.ok) throw new Error('http ' + r.status);
    const j = await r.json();
    if (!j || j.status !== 1 || !j.product) return null;
    const pr = j.product, n = pr.nutriments || {};
    const g = key => { const v = n[key]; return (v === '' || v == null || !isFinite(+v)) ? null : +v; };
    let k = g('energy-kcal_100g');
    if (k == null && g('energy_100g') != null) k = g('energy_100g') / 4.184;
    const per = { k, p: g('proteins_100g'), c: g('carbohydrates_100g'), f: g('fat_100g') };
    let name = String(pr.product_name_fr || pr.product_name || pr.generic_name_fr || '').trim();
    if (name) name = name.charAt(0).toUpperCase() + name.slice(1);
    const brand = String(pr.brands || '').split(',')[0].trim();
    const sq = +pr.serving_quantity;
    const r1 = v => v == null ? '' : Math.round(v * 10) / 10;
    const complete = !!name && per.k != null && per.p != null && per.c != null && per.f != null;
    return {
      name, brand, complete,
      per: complete ? { k: Math.round(per.k), p: r1(per.p), c: r1(per.c), f: r1(per.f) } : null,
      perRaw: { k: per.k == null ? '' : Math.round(per.k), p: r1(per.p), c: r1(per.c), f: r1(per.f) },
      unit: sq > 0 && sq < 2000 ? ['portion', Math.round(sq)] : null
    };
  } finally { clearTimeout(t); }
}
NX.lookupOFF = lookupOFF;

async function decodeBarcode(file) {
  const Z = window.ZXing;
  if (!Z) return null;
  const img = await loadImage(file);
  const hints = new Map();
  hints.set(Z.DecodeHintType.TRY_HARDER, true);
  hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.UPC_E, Z.BarcodeFormat.CODE_128]);
  const reader = new Z.MultiFormatReader(); reader.setHints(hints);
  for (const size of [1400, 900, 2000]) for (const rot of [0, 90]) {
    try {
      const c = drawScaled(img, size, rot);
      const src = new Z.HTMLCanvasElementLuminanceSource(c);
      const res = reader.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(src)));
      if (res && res.getText()) return res.getText();
    } catch (e) { /* essai suivant */ }
  }
  return null;
}
function loadImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => { res(im); setTimeout(() => URL.revokeObjectURL(url), 1000); };
    im.onerror = rej; im.src = url;
  });
}
function drawScaled(img, max, rot) {
  const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.round(img.naturalWidth * s), h = Math.round(img.naturalHeight * s);
  const c = document.createElement('canvas');
  c.width = rot ? h : w; c.height = rot ? w : h;
  const x = c.getContext('2d', { willReadFrequently: true });

  for (let i = 0; i <= 3; i++) { const v = y0 + (y1 - y0) * i / 3, y = Y(v); s += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y.toFixed(1) + '" y2="' + y.toFixed(1) + '"/><text x="' + (L - 6) + '" y="' + (y + 3.5).toFixed(1) + '" text-anchor="end">' + fmt(v, o.dec || 0) + '</text>'; }
  if (o.goal != null) s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(o.goal).toFixed(1) + '" y2="' + Y(o.goal).toFixed(1) + '" stroke="' + o.color + '" stroke-width="1.2" stroke-dasharray="4 4" opacity=".7"/>';
  const d = pts.map((p, i) => (i ? 'L' : 'M') + X(p.x).toFixed(1) + ' ' + Y(p.y).toFixed(1)).join(' ');

  const Y = v => T + (1 - v / max) * (H - T - B);

  for (let i = 0; i <= 3; i++) { const v = max * i / 3, y = Y(v); s += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y.toFixed(1) + '" y2="' + y.toFixed(1) + '"/><text x="' + (L - 6) + '" y="' + (y + 3.5).toFixed(1) + '" text-anchor="end">' + fmt(v / (o.div || 1), o.dec || 0) + '</text>'; }
  vals.forEach((v, i) => {
    if (v == null || v <= 0) return;
    const ok = o.goal ? v >= o.goal * .95 : true;
    s += '<rect x="' + (L + i * bw + gap / 2).toFixed(1) + '" y="' + Y(v).toFixed(1) + '" width="' + Math.max(1, bw - gap).toFixed(1) + '" height="' + (H - B - Y(v)).toFixed(1) + '" rx="' + Math.min(3, (bw - gap) / 2).toFixed(1) + '" fill="' + o.color + '" opacity="' + (ok ? 1 : .45) + '"/>';
  });
  if (o.goal) s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(o.goal).toFixed(1) + '" y2="' + Y(o.goal).toFixed(1) + '" stroke="var(--ink)" stroke-width="1.2" stroke-dasharray="4 4" opacity=".55"/>';
  s += '<text x="' + L + '" y="' + (H - 6) + '">' + esc(shortDate(o.startKey)) + '</text><text x="' + (W - R) + '" y="' + (H - 6) + '" text-anchor="end">' + esc(shortDate(addDays(o.startKey, n - 1))) + '</text>';
  return s + '</svg>';
}
function slope(pts) { // kg par jour (régression linéaire)
  const n = pts.length; if (n < 2) return null;
  const mx = pts.reduce((a, p) => a + p.x, 0) / n, my = pts.reduce((a, p) => a + p.y, 0) / n;
  let a = 0, b = 0; pts.forEach(p => { a += (p.x - mx) * (p.y - my); b += (p.x - mx) ** 2; });
  return b ? a / b : null;
}

};
function paceText(perWeek) {

  if (goal === 'keep') return 'Tendance : <b>' + v + '</b>. ' + (Math.abs(perWeek) < 0.2 ? 'Poids stable, parfait pour un maintien.' : 'Ton poids bouge : ajuste tes calories de 100 à 200 kcal.');

function exPoints(ex, start, n) {

  return Object.keys(byDay).sort().map(k => ({ x: NX.daysBetween(start, k), y: byDay[k] })).filter(p => p.x >= 0 && p.x < n);
}

  const li = (a, i, t, s, c) => '<button class="li" data-a="' + a + '"><span class="lic"' + (c ? ' style="color:' + c + '"' : '') + '>' + ico(i) + '</span><span class="lt"><b>' + t + '</b><span>' + s + '</span></span>' + ico('right', 'sm') + '</button>';
  h += '<section class="sec"><div class="label">Cuisine</div><div class="list">'
    + li('recipes', 'book', 'Mes recettes', S.main.recipes.length ? S.main.recipes.length + ' recette' + (S.main.recipes.length > 1 ? 's' : '') : 'Tes plats maison, calculés par portion', 'var(--brand)')
    + li('combos', 'star', 'Repas favoris', S.main.combos.length ? S.main.combos.length + ' repas' : 'Un repas complet en un geste', 'var(--fat)')
    + li('my-foods', 'fork', 'Mes aliments', S.main.foods.length ? S.main.foods.length + ' aliment' + (S.main.foods.length > 1 ? 's' : '') + ' · ' + Object.keys(S.main.barcodes).length + ' code' + (Object.keys(S.main.barcodes).length > 1 ? 's' : '') + '-barres' : 'Créés par toi ou scannés')
    + li('shopping', 'cart', 'Liste de courses', S.main.shopping.filter(x => !x.done).length ? S.main.shopping.filter(x => !x.done).length + ' article(s) à acheter' : 'Vide pour l\'instant', 'var(--good)')
    + '</div></section>';
  h += '<section class="sec"><div class="label">Réglages</div><div class="list">'
    + li('set-glass', 'drop', 'Taille du verre d\'eau', S.main.settings.glass + ' ml par appui', 'var(--water)')
    + li('rest-cfg', 'timer', 'Temps de repos', (S.main.settings.rest || 90) + ' s entre les séries')
    + li('reminders', 'bell', 'Rappels', 'Pesée, eau, repas')
    + '</div></section>';
  h += '<section class="sec"><div class="label">Mes données</div><div class="list">'
    + li('backup', 'cloud', 'Sauvegarde et export', S.main.lastExport ? 'Dernière sauvegarde le ' + new Date(S.main.lastExport).toLocaleDateString('fr-FR') : 'Aucune sauvegarde pour l\'instant')
    + li('about', 'heart', 'À propos de Nexafit', 'Comment l\'appli fonctionne')
    + '</div></section>';
  h += '<p class="note" style="text-align:center">Nexafit · une création Nexalis</p>';
  return h;
};
const Store = () => NX.Store;
A['set-glass'] = () => NX.openSheet({ id: 'glass', title: 'Taille du verre', render: () => ({ body: '<div class="chips" style="flex-wrap:wrap">' + [150, 200, 250, 330, 500, 750].map(v => '<button class="chip' + (S.main.settings.glass === v ? ' on' : '') + '" data-a="glass-set" data-v="' + v + '">' + v + ' ml</button>').join('') + '</div><p class="note">Chaque appui sur « + » dans la carte Eau ajoutera cette quantité.</p>' }) });
A['glass-set'] = el => { S.main.settings.glass = +el.dataset.v; NX.touchMain(); NX.closeSheet('glass'); NX.render(); };
A.reminders = () => NX.openSheet({ id: 'rem', title: 'Rappels', render: () => ({ body: '<div class="callout">Les applis web ne peuvent pas envoyer de notifications de façon fiable sur iPhone. Le plus simple : crée des rappels qui se répètent dans l\'appli <b>Rappels</b> de ton téléphone.</div><p class="note">Par exemple : « Pesée » tous les matins à 8 h, « Boire de l\'eau » toutes les 2 heures, « Collation » à 16 h.</p><p class="note">Dans Nexafit, la carte du journal te montre d\'un coup d\'œil ce qui manque aujourd\'hui : pesée, eau et sommeil.</p>' }) });
A.about = () => NX.openSheet({ id: 'about', full: true, title: 'À propos de Nexafit', render: () => ({ body:
  '<div class="sec"><div class="label">Tes données</div><p class="note">Tout reste sur ton téléphone : pas de compte, pas de serveur, personne d\'autre ne peut voir tes données. Exporte une sauvegarde de temps en temps (Plus › Sauvegarde et export) : si tu supprimes l\'appli ou changes de téléphone, c\'est elle qui te permettra de tout récupérer.</p></div>'
  + '<div class="sec"><div class="label">Les valeurs nutritionnelles</div><p class="note">La base intégrée contient plus de 120 aliments courants avec des valeurs moyennes, proches de la table Ciqual. Quand tu scannes un produit, Nexafit cherche ses valeurs dans <b>Open Food Facts</b>, une base alimentaire libre et collaborative (licence ODbL). Le produit est ensuite gardé sur ton téléphone et reconnu instantanément.</p></div>'
  + '<div class="sec"><div class="label">Les calculs</div><p class="note">Besoins : formule de Mifflin-St Jeor × niveau d\'activité, puis surplus ou déficit selon l\'objectif. Protéines : 2 g par kg en prise de masse. Lipides : environ 27 % des calories. Glucides : le reste. Force : 1RM estimé avec la formule d\'Epley.</p></div>'
  + '<div class="sec"><div class="label">Installer l\'appli</div><p class="note">Sur iPhone, dans Safari : Partager puis « Sur l\'écran d\'accueil ». Sur Android, dans Chrome : menu ⋮ puis « Ajouter à l\'écran d\'accueil ». Une fois installée, Nexafit fonctionne même sans connexion (sauf la recherche des produits scannés).</p></div>'
  + '<p class="note" style="text-align:center">Nexafit · une création Nexalis</p>' }) });

/* ================= SAUVEGARDE ================= */
A.backup = () => NX.openSheet({ id: 'backup', title: 'Sauvegarde et export', render: () => {
  const nDays = Object.keys(S.days).length, last = S.main.lastExport;
  return { body: '<div class="callout"><b>Tes données sont enregistrées sur ce téléphone.</b> Exporte une sauvegarde de temps en temps et garde-la dans Fichiers ou iCloud Drive : elle te permet de tout récupérer si tu changes de téléphone. ' + (last ? 'Dernière sauvegarde le ' + new Date(last).toLocaleDateString('fr-FR') + '.' : 'Aucune sauvegarde pour l\'instant.') + ' ' + nDays + ' jour' + (nDays > 1 ? 's' : '') + ' enregistré' + (nDays > 1 ? 's' : '') + '.</div>'
    + '<div class="list">'
    + '<button class="li" data-a="export-json"><span class="lic">' + ico('download') + '</span><span class="lt"><b>Exporter une sauvegarde complète</b><span>Fichier .json à garder dans Fichiers ou iCloud</span></span></button>'
    + '<button class="li" data-a="export-csv"><span class="lic">' + ico('list') + '</span><span class="lt"><b>Exporter le journal en tableau</b><span>Fichier .csv lisible dans Excel ou Numbers</span></span></button>'
    + '<button class="li" data-a="import"><span class="lic">' + ico('upload') + '</span><span class="lt"><b>Importer une sauvegarde</b><span>Remplace les données actuelles</span></span></button>'
    + '</div>' };
} });
function exportData() { return JSON.stringify({ app: 'Nexafit', version: 1, exportedAt: new Date().toISOString(), main: S.main, days: S.days }); }
async function offer(filename, data, type) {
  const blob = new Blob([data], { type });
  const done = () => {
    if (/\.json$/.test(filename)) { S.main.lastExport = Date.now(); NX.touchMain(); NX.render(); NX.refreshSheet('backup'); }
    NX.toast('Fichier prêt : ' + filename);
  };
  try {
    const file = new File([blob], filename, { type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); done(); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  try {
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = filename; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    done();
  } catch (e) { NX.toast('Export impossible sur ce navigateur'); }
}
A['export-json'] = () => offer('nexafit-sauvegarde-' + today() + '.json', exportData(), 'application/json');
A['export-csv'] = () => {
  const rows = [['date', 'kcal', 'proteines_g', 'glucides_g', 'lipides_g', 'eau_ml', 'sommeil_h', 'poids_kg', 'seances']];
  Object.keys(S.days).sort().forEach(k => { const d = S.days[k], t = NX.dayTotals(d); rows.push([k, Math.round(t.k), Math.round(t.p), Math.round(t.c), Math.round(t.f), d.water || '', d.sleep || '', d.weight || '', (d.workouts || []).length]); });
  offer('nexafit-journal-' + today() + '.csv', '﻿' + rows.map(r => r.join(';')).join('\n'), 'text/csv');
};
A.import = () => { const i = $('#file-import'); i.value = ''; i.click(); };
$('#file-import').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  let data;
  try { data = JSON.parse(await f.text()); } catch (err) { return NX.toast('Fichier illisible'); }
  if (!data || !data.main || !data.days) return NX.toast('Ce fichier n\'est pas une sauvegarde Nexafit');
  NX.openSheet({ id: 'import-ok', title: 'Importer cette sauvegarde ?', render: () => ({ body: '<p class="note">Sauvegarde du ' + esc(data.exportedAt ? new Date(data.exportedAt).toLocaleDateString('fr-FR') : '?') + ' avec ' + Object.keys(data.days).length + ' jours. Elle remplacera les données actuelles de Nexafit.</p>', foot: '<button class="btn ghost" data-a="sheet-close">Annuler</button><button class="btn" data-a="import-go">Importer</button>' }) });
  A['import-go'] = () => {
    const now = Date.now();
    const oldDays = Object.keys(S.days);
    S.main = Object.assign(S.main, data.main, { updatedAt: now });
    S.days = data.days;
    Object.values(S.days).forEach(d => d.updatedAt = now);
    NX.save('main');
    Object.keys(S.days).forEach(k => NX.save('d-' + k));
    oldDays.filter(k => !S.days[k]).forEach(k => NX.save('d-' + k));
    NX.closeSheet('import-ok'); NX.closeSheet('backup', true);
    UI.tab = 'journal'; UI.date = today(); NX.render(); NX.toast('Sauvegarde importée');
  };
});

NX.boot();
})();

</script>
